id: srp
name: Single Responsibility Review
description: Measures responsibility signals and reports deterministic SRP severity.
max_turns: 10

rule:
  match:
    unit_kinds:
      included: [class, struct, enum, extension, actor, function]

steps:
  - id: classify_actions
    type: agent
    prompt: |
      Analyze unit `{{params.review_unit.target.name}}`. Its source is already
      visible in the current model session; do not request or rediscover it.

      ## SRP-1: Verb Count

      Classify the externally meaningful actions performed by every method
      declared by the supplied unit.

      1. For each method, identify its primary externally meaningful action.
      2. Represent `action` as a single action verb, not a description,
         sentence, or method name.
      3. Set `is_lifecycle` to true when the method is an initializer,
         deinitializer, or factory method. Otherwise set it to false.
      4. Include another action for the same method only when it performs
         another independently changeable responsibility.
      5. Do not create separate actions for calls, branches, fallbacks,
         collection operations, cache operations, formatting primitives, or
         storage primitives that merely implement another action.
      6. Include nonempty reasoning and direct source evidence for every action.
      7. Produce one complete `actions` array after classifying every method.

    outputs:
      - name: actions
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - method
              - action
              - is_lifecycle
              - reasoning
              - evidence
            properties:
              method:
                type: string
                minLength: 1

              action:
                type: string
                minLength: 1

              is_lifecycle:
                type: boolean

              reasoning:
                type: string
                minLength: 1

              evidence:
                type: string
                minLength: 1

    metrics:
      - id: verb_count
        metric_id: SRP-1

        value:
          type: integer
          minimum: 0

        scoring:
          source: actions

          when:
            ref: "{{item.is_lifecycle}}"
            equals: false

          minor:
            operator: greater_than_or_equal
            value: 3

          severe:
            operator: greater_than
            value: 5

  - id: classify_variable_usage
    type: agent
    prompt: |
      Analyze unit `{{params.review_unit.target.name}}`. Its source is already
      visible in the current model session; do not request or rediscover it.

      ## SRP-2: Cohesion Groups

      Classify the instance-variable usage of every method declared by the
      supplied unit.

      1. For every method, identify every instance variable it directly uses.
         Use the variable names declared in the source.
      2. Set `is_lifecycle` to true when the method is an initializer,
         deinitializer, or factory method. Otherwise set it to false.
      3. Set `is_orchestrator` to true only when the method coordinates
         independently meaningful operations rather than using the variables
         together to produce one cohesive outcome.
      4. A method that uses variables from multiple areas to produce one cohesive
         result is not an orchestrator.
      5. Include nonempty reasoning and direct source evidence for every method.
      6. Produce one complete `method_variable_usage` array after classifying
         every method.

    outputs:
      - name: method_variable_usage
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - method
              - variables
              - is_lifecycle
              - is_orchestrator
              - reasoning
              - evidence
            properties:
              method:
                type: string
                minLength: 1

              variables:
                type: array
                uniqueItems: true
                items:
                  type: string
                  minLength: 1

              is_lifecycle:
                type: boolean

              is_orchestrator:
                type: boolean

              reasoning:
                type: string
                minLength: 1

              evidence:
                type: string
                minLength: 1

    metrics:
      - id: cohesion_groups
        metric_id: SRP-2

        value:
          type: integer
          minimum: 0

        scoring:
          source: method_variable_usage

          when:
            all:
              - ref: "{{item.is_lifecycle}}"
                equals: false

              - ref: "{{item.is_orchestrator}}"
                equals: false

          reducer:
            type: component_count
            relation:
              operator: intersects
              left: "{{left.variables}}"
              right: "{{right.variables}}"

          severe:
            operator: greater_than_or_equal
            value: 2

  - id: classify_stakeholders
    type: agent
    prompt: |
      Analyze unit `{{params.review_unit.target.name}}`. Its source is already
      visible in the current model session; do not request or rediscover it.

      ## SRP-3: Stakeholder Count

      A class, function, struct, module, or instance should have one reason to
      change.

      Classify the distinct stakeholders who could independently request
      changes to the supplied unit.

      1. Identify change-driving concerns demonstrated by the unit's behavior.
      2. Do not create stakeholders for every framework type, dependency,
         implementation mechanism, or hypothetical team.
      3. Treat backing storage, caching, and cache consistency as one
         data-access stakeholder when they jointly implement retrieval and
         persistence behavior.
      4. Treat templates, number formatting, string formatting, and collection
         layout as one presentation stakeholder when they jointly produce
         displayed output.
      5. Include security, operations, product policy, validation, or another
         stakeholder only when the unit contains independently changeable
         behavior for that concern.
      6. Do not infer a stakeholder solely from a type or method name.
      7. Include nonempty reasoning and direct source evidence for every
         stakeholder.
      8. Produce one complete `stakeholders` array after analyzing the unit.

    outputs:
      - name: stakeholders
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - stakeholder
              - methods
              - reasoning
              - evidence
            properties:
              stakeholder:
                type: string
                minLength: 1

              methods:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1

              reasoning:
                type: string
                minLength: 1

              evidence:
                type: string
                minLength: 1

    metrics:
      - id: stakeholder_count
        metric_id: SRP-3

        value:
          type: integer
          minimum: 0

        scoring:
          source: stakeholders

          severe:
            operator: greater_than_or_equal
            value: 2

  - id: classify_exception
    type: exception
    depends_on:
      - verb_count
      - cohesion_groups
      - stakeholder_count

    prompt: |
      Analyze whether unit `{{params.review_unit.target.name}}` is an SRP
      facade or coordinator exception.

      A class that only coordinates protocol-typed subsystems has one
      responsibility: coordination.

      Classify it as an exception only when all of these conditions hold:

      1. Every stored property and initializer parameter is protocol-typed.
      2. Every method body performs pure delegation without business logic or
         branching on the unit's own mutable state.
      3. The unit creates no collaborators internally; every dependency is
         injected through its initializer.

      Include nonempty reasoning and direct source evidence supporting the
      classification.
