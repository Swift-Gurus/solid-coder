id: solid-review
name: SOLID Review
description: Applies the reusable file-review workflow to one explicit prospective review target.
max_turns: 1000

steps:
  - id: capture_target
    type: agent
    prompt: |
      Submit the review target identified in your prompt.
      Use kind "file" with an absolute path, or kind "text" with the code.
      Submit context_sources as an empty array; this entry point reviews one
      explicit target rather than a prospective multi-file patch.
    outputs:
      - name: target
        type: data
        schema:
          oneOf:
            - type: object
              additionalProperties: false
              required: [ kind, path ]
              properties:
                kind:
                  const: file
                path:
                  type: string

            - type: object
              additionalProperties: false
              required: [ kind, text ]
              properties:
                kind:
                  const: text
                text:
                  type: string
                virtual_path:
                  type: string
                file_extension:
                  type: string
      - name: context_sources
        type: data
        schema:
          type: array
          maxItems: 0

  - include:
      workflow: solid-file-review
    as: file_review
    depends_on: [capture_target]
    with:
      target: "{{steps.capture_target.outputs.target}}"
      context_sources: "{{steps.capture_target.outputs.context_sources}}"
