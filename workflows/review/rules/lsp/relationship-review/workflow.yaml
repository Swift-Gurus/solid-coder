id: lsp-relationship-review
name: LSP Relationship Evidence
description: Reads one selected declaration and records contract evidence for the parent classifier.
max_turns: 2

steps:
  - id: inspect_candidate
    prompt: |
      For candidate `{{params.candidate.candidate_id}}`, read
      `{{params.candidate.source.path}}` with your normal file-reading tool
      and inspect only declaration `{{params.candidate.source.unit}}` for reviewed
      subtype `{{params.subtype_name}}`, whose source is already visible in this
      model session. Record the base contract's guards, guarantees and state
      invariants relevant to that subtype's overrides. Identify the declaration
      and members in the source evidence. Do not classify violations here.

      Return concise reasoning about whether the selected declaration is the
      concrete base or another contract required to evaluate the reviewed
      subtype. Evidence must identify the selected path and declaration. If the
      source cannot be read, record why verification is unavailable.

      Candidate frontmatter description: {{params.candidate.source.description}}
    outputs:
      - name: reasoning
        type: data
        schema: {type: string, minLength: 1}
      - name: evidence
        type: data
        schema: {type: string, minLength: 1}
