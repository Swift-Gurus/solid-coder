id: lsp
name: Liskov Substitution Principle Review
description: Measures type checks, inheritance contract violations, and unsupported protocol behavior and reports deterministic LSP severity.
max_turns: 12

rule: {}

steps:
  - id: analyze_substitutability
    prompt: |
      1. **Count typechecks** — `is`, `as?`, `as!`, `type(of:)` used with concrete types, protocols, interfaces
      2. **Count out exceptions**
         - see typecast-lsp-exception.swift in Examples
         - identify the source of typecasted object
         - search in project/local packages/local framework files
         - if not found -> external -> exception
         - if found -> developer-owned -> violation
      3. **Total Count** = total type checks minus exceptions

      1. **Detect inheritance** — does the class inherit from a concrete base class (not just protocol conformance)?
      2. **If yes** — read the base class source code
      3. **For each `override` method, compare base vs subtype:**

         **a. Precondition Changes** — new guard clauses in subtype not present in base

         | Method | Base Guards | Subtype Guards | New Guards |
         |--------|------------|----------------|------------|
         |        |            |                |            |

         **b. Postcondition Weakening** — assertions/guarantees removed or relaxed in subtype

         | Method | Base Assertions | Subtype Assertions | Weakened |
         |--------|----------------|-------------------|----------|
         |        |                |                   |          |

         **c. Invariant Violations** — protected/private state exposed with public setters, or validated state bypass

         | Property | Base Access | Subtype Access | Violation |
         |----------|------------|----------------|-----------|
         |          |            |                |           |

      4. **Count** = total contract violations (new guards + weakened postconditions + invariant violations)

      *Note*: If the base class source is not available for reading, flag as "unable to verify" rather than assuming compliant.

      1. **Count total methods/vars in the interface**
      2. **Count empty methods/vars** 
      3. **Count methods with fatal-error(or any conditions that cause crash)**
      4. **Calculate percentage of empty** - empty(non-fatal methods) methods/vars / total methods/vars

      Analyze type-check ownership, inheritance applicability and overrides, and contract member implementations once. Preserve evidence for every entry so all LSP metrics reuse the same trigger and contract facts.

      Scope every fact to unit `{{params.review_unit.target.name}}` as it appears in the current model session. Do not borrow a subtype, conformer, method body, or violation from another normalized unit.

      Protocol conformance is not concrete inheritance. Set `inheritance.has_trigger` to true only when this supplied unit inherits from a concrete base class and declares an override; otherwise set it to false with no relationships.

      Only classify contract implementations whose method bodies are present inside unit `{{params.review_unit.target.name}}`. Protocol requirements declared without bodies are not implementations, so a protocol-only unit must return an empty `contract_implementations` array. Never inspect or report a conformer merely because the supplied unit declares its protocol.
    outputs:
      - name: type_checks
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [expression, ownership, evidence]
            properties:
              expression: {type: string, minLength: 1}
              ownership:
                type: string
                enum: [DEVELOPER, EXTERNAL, UNKNOWN]
              evidence: {type: string, minLength: 1}
      - name: inheritance
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [has_trigger, relationships, reasoning, evidence]
          properties:
            has_trigger: {type: boolean}
            relationships:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [base_type, source_available, evidence, overrides]
                properties:
                  base_type: {type: string, minLength: 1}
                  source_available: {type: boolean}
                  evidence: {type: string, minLength: 1}
                  overrides:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [member, new_guards, weakened_postconditions, invariant_violations, evidence]
                      properties:
                        member: {type: string, minLength: 1}
                        new_guards: {type: integer, minimum: 0}
                        weakened_postconditions: {type: integer, minimum: 0}
                        invariant_violations: {type: integer, minimum: 0}
                        evidence: {type: string, minLength: 1}
            reasoning: {type: string, minLength: 1}
            evidence: {type: string, minLength: 1}
      - name: contract_implementations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [member, classification, evidence]
            properties:
              member: {type: string, minLength: 1}
              classification:
                type: string
                enum: [MEANINGFUL, EMPTY, FATAL]
              evidence: {type: string, minLength: 1}

  - id: type_checks
    type: metric
    metric_id: LSP-1
    depends_on: [analyze_substitutability]
    prompt: |
      - A "type check" is a place where client code inspects the concrete type/interfaces/protocols behind an abstraction. Each type check means the client knows about subtypes — the wrong abstraction was picked.

      Count type checks classified as DEVELOPER in the shared analysis. EXTERNAL checks are exceptions and UNKNOWN checks must be reported as unable to verify rather than assumed violations. Do not rediscover ownership.

      Use the type-check analysis you previously submitted for unit `{{params.review_unit.target.name}}`; do not rediscover or revise it.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: contract_violations
    type: metric
    metric_id: LSP-2
    depends_on: [analyze_substitutability]
    prompt: |
      When a class inherits from another class and overrides methods, the subtype must honor the base contract: same or weaker preconditions, same or stronger postconditions, preserved invariants.

      **Trigger:** This metric only applies when `override` methods are detected in class inheritance. For protocol conformance without class inheritance, LSP-2 does not apply.

      Use the shared inheritance trigger and relationships. When `has_trigger` is true, sum new guards, weakened postconditions, and invariant violations. When it is false, return zero and preserve the typed trigger evidence in `additional_info`. Do not rediscover inheritance.

      Use the inheritance analysis you previously submitted for unit `{{params.review_unit.target.name}}`; do not rediscover or revise it.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: fatal_error_methods
    type: metric
    metric_id: LSP-3
    depends_on: [analyze_substitutability]
    prompt: |
      - When an object conforms to an interface/protocol and have methods non-implemented or crashing, this breaks the contract
      - Empty methods or vars. Meaning non implemented methods or var from the contract
      - Methods/vars whose entire body is a crash assertion — the method exists only to satisfy protocol conformance, not to provide real behavior.
        - fatalError, preconditionFailure, assertionFailure, fatalError("not implemented"), fatalError("abstract method"), fatalError("invalid state")

      Count contract implementations classified as FATAL in the shared analysis. Do not rediscover or reclassify members.

      Use the contract-implementation analysis you previously submitted for unit `{{params.review_unit.target.name}}`; do not rediscover or revise it.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: empty_methods
    type: metric
    metric_id: LSP-4
    depends_on: [analyze_substitutability]
    prompt: |
      - When an object conforms to an interface/protocol and have methods non-implemented or crashing, this breaks the contract
      - Empty methods or vars. Meaning non implemented methods or var from the contract
      - Methods/vars whose entire body is a crash assertion — the method exists only to satisfy protocol conformance, not to provide real behavior.
        - fatalError, preconditionFailure, assertionFailure, fatalError("not implemented"), fatalError("abstract method"), fatalError("invalid state")

      Count contract implementations classified as EMPTY in the shared analysis. Do not include FATAL implementations and do not rediscover or reclassify members.

      Use the contract-implementation analysis you previously submitted for unit `{{params.review_unit.target.name}}`; do not rediscover or revise it.
    value:
      type: integer
      minimum: 0
    scoring:
      minor:
        operator: greater_than_or_equal
        value: 1

  - id: classify_exception
    type: exception
    depends_on: [analyze_substitutability]
    prompt: |
      Decide whether the entire supplied unit is exempt from LSP review under this authored exception:

      1. **NoOp objects** — objects that provide no-op default behaviour (turn-off for testing, or when not initialized)
         - consider NoOps object if the name states it and 100% of methods/var from the contract are empty, or resolved to default values

      Classify unit `{{params.review_unit.target.name}}` using the type-check, inheritance, and contract-implementation analyses you previously submitted; do not rediscover or revise them.
