id: lsp
name: Liskov Substitution Principle Review
description: Measures type checks, inheritance contract violations, and unsupported protocol behavior from durable typed evidence.
max_turns: 24

rule: {}

steps:
  - id: analyze_substitutability
    prompt: |
      Analyze only unit `{{params.review_unit.target.name}}` from the source
      already visible in this model session. Do not inspect repository
      candidates, count metrics, choose severity, or submit findings.

      ## LSP-1: Type Check Count

      - A "type check" is a place where client code inspects the concrete type/interfaces/protocols behind an abstraction. Each type check means the client knows about subtypes — the wrong abstraction was picked.

      1. **Count typechecks** — `is`, `as?`, `as!`, `type(of:)` used with concrete types, protocols, interfaces
      2. **Count out exceptions**
         - see typecast-lsp-exception.swift in Examples
         - identify the source of typecasted object
         - search in project/local packages/local framework files
         - if not found -> external -> exception
         - if found -> developer-owned -> violation
      3. **Total Count** = total type checks minus exceptions

      Return one `type_checks` entry for every expression. Preserve whether its
      checked type is developer-owned, external, or unknown with exact evidence.

      ## Concrete inheritance trigger

      Protocol conformance is not concrete inheritance. Set `has_inheritance` to
      true only when this supplied unit inherits from a concrete base class and
      declares an override. Return the base declaration name and useful exact
      name variants as individual `relationship_terms`. When there is no such
      relationship, set `has_inheritance` to false and return the supplied unit
      name as the sole term; MCP will skip repository relationship analysis.

      ## LSP-3: Empty Methods

      - When an object conforms to an interface/protocol and have methods non-implemented or crashing, this breaks the contract
      - Empty methods or vars. Meaning non implemented methods or var from the contract
      - Methods/vars whose entire body is a crash assertion — the method exists only to satisfy protocol conformance, not to provide real behavior.
        - fatalError, preconditionFailure, assertionFailure, fatalError("not implemented"), fatalError("abstract method"), fatalError("invalid state")

      1. **Count total methods/vars in the interface**
      2. **Count empty methods/vars** 
      3. **Count methods with fatal-error(or any conditions that cause crash)**
      4. **Calculate percentage of empty** - empty(non-fatal methods) methods/vars / total methods/vars

      Return one `contract_implementations` entry only for implementations whose
      bodies are present inside the supplied unit. Protocol requirements declared
      without bodies are not implementations. Never inspect or report a conformer
      merely because the supplied unit declares its protocol.
    outputs:
      - name: type_checks
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [expression, ownership, evidence]
            properties:
              expression: {type: string, minLength: 1}
              ownership:
                type: string
                enum: [DEVELOPER, EXTERNAL, UNKNOWN]
              evidence: {type: string, minLength: 1}
      - name: has_inheritance
        type: data
        schema: {type: boolean}
      - name: relationship_terms
        type: data
        schema:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            pattern: "^[^\\s,;]+$"
      - name: contract_implementations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [member, classification, evidence]
            properties:
              member: {type: string, minLength: 1}
              classification:
                type: string
                enum: [MEANINGFUL, EMPTY, FATAL]
              evidence: {type: string, minLength: 1}

  - id: prepare_relationship_query
    type: operation
    operation: source.prepare_search_query
    depends_on: [analyze_substitutability]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    with:
      target: "{{params.review_unit.target}}"
      generated_terms: "{{steps.analyze_substitutability.outputs.relationship_terms}}"

  - id: search_relationship_candidates
    type: operation
    operation: source.search
    depends_on: [prepare_relationship_query]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    with:
      queries: "{{steps.prepare_relationship_query.outputs.queries}}"
      excluded_units: "{{steps.prepare_relationship_query.outputs.excluded_units}}"
      context: "{{params.source_context}}"
      included_file_extensions: "{{steps.prepare_relationship_query.outputs.included_file_extensions}}"

  - id: present_relationship_candidates
    type: operation
    operation: source.present_search
    depends_on: [search_relationship_candidates]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    with:
      candidates: "{{steps.search_relationship_candidates.outputs.candidates}}"
      files_scanned: "{{steps.search_relationship_candidates.outputs.files_scanned}}"

  - id: select_relationship_candidates
    depends_on: [present_relationship_candidates]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    prompt: |
      Account for every repository candidate shown below. Return exactly one
      disposition for every `candidate_id`, copying that ID exactly.

      Use INSPECT when the candidate may be the concrete base declaration or a
      contract needed to compare reviewed subtype
      `{{params.review_unit.target.name}}`. Use REJECT only when its name and
      frontmatter description prove it cannot participate. Explain every
      disposition from the shown metadata. Do not read source, omit or invent an
      ID, classify a relationship, count violations, or choose severity.

      {{steps.present_relationship_candidates.outputs.text}}
    outputs:
      - name: dispositions
        type: data
        schema:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, disposition, reasoning, evidence]
            properties:
              candidate_id:
                type: string
                pattern: "^candidate-[1-9][0-9]*$"
              disposition:
                type: string
                enum: [INSPECT, REJECT]
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: validate_relationship_candidates
    type: operation
    operation: source.validate_candidate_selection
    depends_on: [select_relationship_candidates]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    with:
      candidates: "{{steps.search_relationship_candidates.outputs.candidates}}"
      dispositions: "{{steps.select_relationship_candidates.outputs.dispositions}}"

  - include:
      workflow: lsp-relationship-review
    as: relationship_reviews
    depends_on: [validate_relationship_candidates]
    when:
      ref: "{{steps.analyze_substitutability.outputs.has_inheritance}}"
      equals: true
    for_each: "{{steps.validate_relationship_candidates.outputs.selected_candidates}}"
    with:
      candidate: "{{item}}"
      subtype_name: "{{params.review_unit.target.name}}"

  - id: classify_relationship_violations
    depends_on: [analyze_substitutability, relationship_reviews]
    prompt: |
      Normalize the completed repository relationship classifications for
      reviewed subtype `{{params.review_unit.target.name}}`. Do not inspect or
      reread source, search again, infer another relationship, count entries,
      choose severity, or submit a finding.

      When the submitted inheritance trigger was false, or no selected candidate
      was a relevant relationship, return an empty `observations` array. Otherwise
      return exactly one observation for every independently classified
      relationship violation already submitted by the child reviews. Do not omit,
      merge, duplicate, or revise a child classification. Preserve candidate ID,
      member, exception status, reasoning, and evidence.

      When a class inherits from another class and overrides methods, the subtype must honor the base contract: same or weaker preconditions, same or stronger postconditions, preserved invariants.

      **Trigger:** This metric only applies when `override` methods are detected in class inheritance. For protocol conformance without class inheritance, LSP-2 does not apply.

      1. **Detect inheritance** — does the class inherit from a concrete base class (not just protocol conformance)?
      2. **If yes** — read the base class source code
      3. **For each `override` method, compare base vs subtype:**

         **a. Precondition Changes** — new guard clauses in subtype not present in base

         | Method | Base Guards | Subtype Guards | New Guards |
         |--------|------------|----------------|------------|
         |        |            |                |            |

         **b. Postcondition Weakening** — assertions/guarantees removed or relaxed in subtype

         | Method | Base Assertions | Subtype Assertions | Weakened |
         |--------|----------------|-------------------|----------|
         |        |                |                   |          |

         **c. Invariant Violations** — protected/private state exposed with public setters, or validated state bypass

         | Property | Base Access | Subtype Access | Violation |
         |----------|------------|----------------|-----------|
         |          |            |                |           |

      4. **Count** = total contract violations (new guards + weakened postconditions + invariant violations)

      *Note*: If the base class source is not available for reading, flag as "unable to verify" rather than assuming compliant.
    outputs:
      - name: observations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, classification, member, is_exception, reasoning, evidence]
            properties:
              candidate_id:
                type: string
                pattern: "^candidate-[1-9][0-9]*$"
              classification:
                type: string
                enum: [NEW_GUARD, WEAKENED_POSTCONDITION, INVARIANT_VIOLATION]
              member: {type: string, minLength: 1}
              is_exception: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: type_checks
    type: metric
    metric_id: LSP-1
    depends_on: [analyze_substitutability]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_substitutability.outputs.type_checks}}"
      when:
        ref: "{{item.ownership}}"
        equals: DEVELOPER
      severe: {operator: greater_than_or_equal, value: 1}

  - id: contract_violations
    type: metric
    metric_id: LSP-2
    depends_on: [classify_relationship_violations]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_relationship_violations.outputs.observations}}"
      when:
        ref: "{{item.is_exception}}"
        equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: fatal_error_methods
    type: metric
    metric_id: LSP-3
    depends_on: [analyze_substitutability]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_substitutability.outputs.contract_implementations}}"
      when:
        ref: "{{item.classification}}"
        equals: FATAL
      severe: {operator: greater_than_or_equal, value: 1}

  - id: empty_methods
    type: metric
    metric_id: LSP-4
    depends_on: [analyze_substitutability]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_substitutability.outputs.contract_implementations}}"
      when:
        ref: "{{item.classification}}"
        equals: EMPTY
      minor: {operator: greater_than_or_equal, value: 1}

  - id: classify_exception
    type: exception
    depends_on: [type_checks, contract_violations, fatal_error_methods, empty_methods]
    prompt: |
      Decide whether the entire supplied unit is exempt from LSP review under this authored exception:

      1. **NoOp objects** — objects that provide no-op default behaviour (turn-off for testing, or when not initialized)
         - consider NoOps object if the name states it and 100% of methods/var from the contract are empty, or resolved to default values

      Classify unit `{{params.review_unit.target.name}}` using only the completed
      type-check, relationship, and contract-implementation analyses. Do not
      inspect source again, recalculate a metric, or revise an earlier decision.
