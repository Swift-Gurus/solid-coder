id: ocp
name: Open Closed Principle Review
description: >
  Measures sealed variation points and concrete dependency testability.
  The model supplies observable dependency facts; MCP deterministically
  derives metric values and severity.
max_turns: 10

rule: {}

steps:
  - id: analyze_dependencies
    type: agent
    prompt: |
      Analyze every dependency used by unit
      `{{params.review_unit.target.name}}`.

      The unit source is already visible in the current model session.

      ## 1. Inventory dependencies

      List every external type or runtime collaborator used through:

      - stored properties
      - initializer, factory, or method parameters
      - method calls to external types
      - constructed objects
      - singleton or static access
      - dependencies reached through another collaborator

      Analyze each dependency exactly once.

      ## 2. Classify each dependency

      Assign exactly one classification:

      ### ABSTRACT (protocol-typed and injected)

      ### DIRECT_INJECTED

      The dependency is concrete and is supplied directly through an
      initializer, factory method, convenience initializer, or another
      construction boundary.

      A concrete default argument on a construction method remains injected.

      ### DIRECT_NON_INJECTED

      The dependency is concrete and acquired internally by the unit, including:

      - direct construction
      - singleton access
      - static/global access
      - service location
      - hidden concrete defaults created inside the unit

      ### INDIRECT

      The concrete dependency is reached through another dependency rather
      than being acquired directly by the reviewed unit.

      ## 3. Record observable dependency properties

      For every dependency answer:

      - `has_business_logic`
        Does the dependency make domain or application decisions?

      - `has_behavioral_dependencies`
        Does the dependency itself collaborate with runtime services or other
        behavioral dependencies?

      - `has_side_effecting_behavior`
        Does the dependency perform observable work outside its own stored
        data, such as networking, persistence, logging, notifications,
        process interaction, global mutation, or runtime service calls?

        Merely storing or mutating its own data does not count as
        side-effecting behavior.

      - `can_substitute_without_modifying_unit`
        Can the reviewed unit receive an alternative implementation or test
        double without changing the reviewed unit's source?

      - `can_subclass`
        Can the concrete dependency type be subclassed?

      - `can_instantiate`
        Can a caller construct an instance of the dependency type?

      Supply precise reasoning and source evidence for every dependency.

      ## 4. Record hardcoded behavior selections

      Separately list every location where the unit selects behavior through
      hardcoded cases, concrete-type checks, string identifiers, enum cases,
      or equivalent branching that must be modified whenever a new behavior
      is introduced.

      Do not include ordinary validation branches or branches that do not
      select among behavioral implementations.

      Return an empty array when none exist.

    outputs:
      - name: dependencies
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - classification
              - has_business_logic
              - has_behavioral_dependencies
              - has_side_effecting_behavior
              - can_substitute_without_modifying_unit
              - can_subclass
              - can_instantiate
              - reasoning
              - evidence
            properties:
              name:
                type: string
                minLength: 1

              classification:
                type: string
                enum:
                  - ABSTRACT
                  - DIRECT_INJECTED
                  - DIRECT_NON_INJECTED
                  - INDIRECT

              has_business_logic:
                type: boolean

              has_behavioral_dependencies:
                type: boolean

              has_side_effecting_behavior:
                type: boolean

              can_substitute_without_modifying_unit:
                type: boolean

              can_subclass:
                type: boolean

              can_instantiate:
                type: boolean

              reasoning:
                type: string
                minLength: 1

              evidence:
                type: string
                minLength: 1

      - name: hardcoded_behavior_selections
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - reasoning
              - evidence
            properties:
              reasoning:
                type: string
                minLength: 1

              evidence:
                type: string
                minLength: 1

  # OCP-1: internally acquired concrete behavioral dependencies.
  - id: sealed_variation_points
    type: metric
    metric_id: OCP-1
    observation_id: direct_non_injected_count
    depends_on:
      - analyze_dependencies

    value:
      type: integer
      minimum: 0

    scoring:
      source: "{{steps.analyze_dependencies.outputs.dependencies}}"
      when:
        all:
          - ref: "{{item.classification}}"
            equals: DIRECT_NON_INJECTED

          # A pure-data dependency has all three observable signals false.
          # Negating that condition retains only behavioral dependencies.
          - not:
              all:
                - ref: "{{item.has_business_logic}}"
                  equals: false

                - ref: "{{item.has_behavioral_dependencies}}"
                  equals: false

                - ref: "{{item.has_side_effecting_behavior}}"
                  equals: false

      severe:
        operator: greater_than_or_equal
        value: 1

  # OCP-1 also includes hardcoded behavior-selection points that may exist
  # without an external dependency.
  - id: hardcoded_behavior_selection_count
    type: metric
    metric_id: OCP-1
    observation_id: hardcoded_behavior_selection_count
    depends_on:
      - analyze_dependencies

    value:
      type: integer
      minimum: 0

    scoring:
      source: "{{steps.analyze_dependencies.outputs.hardcoded_behavior_selections}}"

      severe:
        operator: greater_than_or_equal
        value: 1

  # OCP-2: injected or indirect concrete behavioral dependencies that cannot
  # be substituted and cannot be subclassed.
  - id: untestable_concrete_dependencies
    type: metric
    metric_id: OCP-2
    observation_id: untestable_concrete_count
    depends_on:
      - analyze_dependencies

    value:
      type: integer
      minimum: 0

    scoring:
      source: "{{steps.analyze_dependencies.outputs.dependencies}}"
      when:
        all:
          - any:
              - ref: "{{item.classification}}"
                equals: DIRECT_INJECTED

              - ref: "{{item.classification}}"
                equals: INDIRECT

          - not:
              all:
                - ref: "{{item.has_business_logic}}"
                  equals: false

                - ref: "{{item.has_behavioral_dependencies}}"
                  equals: false

                - ref: "{{item.has_side_effecting_behavior}}"
                  equals: false

          - ref: "{{item.can_substitute_without_modifying_unit}}"
            equals: false

          - ref: "{{item.can_subclass}}"
            equals: false

      severe:
        operator: greater_than_or_equal
        value: 1

  # OCP-3: injected or indirect concrete behavioral dependencies that remain
  # substitutable or subclassable. These are testable but still concrete.
  - id: testable_concrete_dependencies
    type: metric
    metric_id: OCP-3
    observation_id: testable_concrete_count
    depends_on:
      - analyze_dependencies

    value:
      type: integer
      minimum: 0

    scoring:
      source: "{{steps.analyze_dependencies.outputs.dependencies}}"
      when:
        all:
          - any:
              - ref: "{{item.classification}}"
                equals: DIRECT_INJECTED

              - ref: "{{item.classification}}"
                equals: INDIRECT

          - not:
              all:
                - ref: "{{item.has_business_logic}}"
                  equals: false

                - ref: "{{item.has_behavioral_dependencies}}"
                  equals: false

                - ref: "{{item.has_side_effecting_behavior}}"
                  equals: false

          - any:
              - ref: "{{item.can_substitute_without_modifying_unit}}"
                equals: true

              - ref: "{{item.can_subclass}}"
                equals: true

      minor:
        operator: greater_than_or_equal
        value: 1

  - id: classify_exception
    type: exception
    depends_on:
      - analyze_dependencies

    prompt: |
      Decide whether the entire unit
      `{{params.review_unit.target.name}}`
      is exempt from OCP review.

      Use the unit source and the dependency analysis already submitted.
      Do not rediscover or reclassify dependencies.

      Apply only these whole-unit exceptions:

      1. **Factories/Builders** — a class whose primary responsibility is
         constructing or composing other objects (name ends in Factory,
         Builder, Assembler, or Configurator; or its primary output is a fully
         configured object graph). The ENTIRE class is exempt from OCP-1 and
         OCP-2: constructing, holding, and wiring concrete dependencies is
         inherently its job. Do NOT flag individual instantiations inside a
         Factory/Builder as sealed variation points.

      2. **Dependency-free units** — units with no dependencies and no
         hardcoded behavior-selection logic are exempt.

      3. **Pure data structures** — immutable or mutable data carriers with no
         business logic, runtime collaborators, or side effects are exempt.

      4. **Boundary Adapters** — applies ONLY when wrapping truly static-only
         APIs.

      5. **Pure Views UI elements** — UI elements that don't have any business
         logic dependencies.

      6. **Test code** — unit tests, UI tests, integration tests, mocks, stubs,
         fakes, and test helpers are exempt. Test code intentionally uses
         concrete types and is not subject to OCP review.

      When encountering a `.shared` / `.default` / static access, inspect the
      returned type before deciding:

      | Returned type | Can instantiate / subclass? | Action | Boundary Adapter? |
      |---------------|-----------------------------|--------|-------------------|
      | Concrete class (non-final) | Yes — can subclass | Protocol extension conformance + inject the instance | No |
      | Concrete final class | Yes — can instantiate | Protocol extension conformance + inject the instance | No |
      | Protocol / interface | Already abstract | Depend on the protocol directly | No |
      | Enum with static members only | No | Wrap in adapter struct | Yes |
      | Global function / constant | No | Wrap in adapter struct | Yes |

      Boundary Adapter Recognition Conditions — ALL must hold:

      - API is not owned by dev (search in project/local packages/local
        framework files)
      - API doesn't support instantiation: enums with only static members,
        global constants, static global functions
      - The type cannot be subclassed or instantiated — only then is a wrapper
        struct justified
