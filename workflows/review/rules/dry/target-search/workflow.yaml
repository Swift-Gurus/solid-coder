id: dry-target-search
name: DRY Target Search
description: Searches deterministic repository candidates for one MCP-owned review target and classifies each loaded comparison.
max_turns: 20

outputs:
  - name: candidate_classifications
    type: data
    value: "{{steps.classify_candidate.outputs.assessment}}"
    schema:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [classification, reasoning, evidence]
        properties:
          classification:
            type: string
            enum: [EXACT, EXTENSIBLE, PARTIAL, IDENTICAL, STRUCTURAL, SIMILAR]
          reasoning: {type: string, minLength: 1}
          evidence: {type: string, minLength: 1}

steps:
  - id: generate_terms
    prompt: |
      Generate semantic search terms for the immutable target code already supplied below.

      Return only individual synonyms or alternative names that may identify existing code with the same responsibility or logical behavior. Do not inspect files, invent paths, create an ID, repeat deterministic names, classify candidates, count findings, or decide severity. Each term must be one non-empty value without whitespace, commas, semicolons, regular expressions, or shell syntax.

      Target name: {{params.target.name}}
      Target kind: {{params.target.kind}}
      Target code:
      ```
      {{params.target.code}}
      ```
    outputs:
      - name: generated_terms
        type: data
        schema:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}

  - id: prepare_query
    type: operation
    operation: source.prepare_search_query
    depends_on: [generate_terms]
    with:
      target: "{{params.target}}"
      generated_terms: "{{steps.generate_terms.outputs.generated_terms}}"

  - id: search_repository
    type: operation
    operation: source.search
    depends_on: [prepare_query]
    with:
      queries: "{{steps.prepare_query.outputs.queries}}"
      excluded_units: "{{steps.prepare_query.outputs.excluded_units}}"
      context: "{{params.context}}"

  - id: read_candidates
    type: operation
    operation: source.read_candidates
    depends_on: [search_repository]
    with:
      candidates: "{{steps.search_repository.outputs.candidates}}"
      context: "{{params.context}}"

  - id: classify_candidate
    depends_on: [read_candidates]
    for_each: "{{steps.read_candidates.outputs.results}}"
    when:
      ref: "{{item.kind}}"
      equals: loaded
    prompt: |
      Compare the immutable reviewed target with this bounded repository candidate. Use only the supplied code and provenance; do not inspect files, search again, echo either identity, count findings, or decide severity.

      Classify the comparison as exactly one of:
      - EXACT — the candidate covers the complete responsibility and can be reused directly.
      - EXTENSIBLE — the candidate covers the core responsibility and can be extended by configuration, overload, or protocol extension.
      - PARTIAL — the overlap has meaningful semantic differences and direct reuse is inappropriate.
      - IDENTICAL — the same logic and concrete types appear with names or locations changed only.
      - STRUCTURAL — the same algorithm or control flow appears with different concrete types.
      - SIMILAR — there is overlap, but meaningful differences mean it is not a duplication violation.

      Target:
      ```
      {{params.target.code}}
      ```

      Candidate match provenance: {{item.candidate.matches}}
      Candidate frontmatter description: {{item.candidate.description}}
      Candidate:
      ```
      {{item.content}}
      ```
    outputs:
      - name: assessment
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [classification, reasoning, evidence]
          properties:
            classification:
              type: string
              enum: [EXACT, EXTENSIBLE, PARTIAL, IDENTICAL, STRUCTURAL, SIMILAR]
            reasoning: {type: string, minLength: 1}
            evidence: {type: string, minLength: 1}
