id: dry
name: Don't Repeat Yourself Review
description: Measures reuse misses, duplicated source sites, and missing abstractions from local and repository evidence.
max_turns: 60

rule: {}

steps:
  - id: generate_terms
    prompt: |
      Generate semantic search terms for reviewed unit `{{params.review_unit.target.name}}` using its source already visible in the current model session.

      Return only individual synonyms or name components that may identify existing code with the same responsibility or logical behavior. Do not inspect files, invent paths, create an ID, repeat deterministic names, classify candidates, count findings, or decide severity. Each term must be exactly one lexical word without whitespace, commas, semicolons, regular expressions, or shell syntax. Do not return compound type or method names: for `RemoteResourceLoader`, return `remote`, `resource`, and `loader`; never return the compound name.

      Target name: {{params.review_unit.target.name}}
      Target kind: {{params.review_unit.target.kind}}
    outputs:
      - name: generated_terms
        type: data
        schema:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}

  - id: prepare_query
    type: operation
    operation: source.prepare_search_query
    depends_on: [generate_terms]
    with:
      target: "{{params.review_unit.target}}"
      generated_terms: "{{steps.generate_terms.outputs.generated_terms}}"

  - id: search_repository
    type: operation
    operation: source.search
    depends_on: [prepare_query]
    with:
      queries: "{{steps.prepare_query.outputs.queries}}"
      excluded_units: "{{steps.prepare_query.outputs.excluded_units}}"
      context: "{{params.source_context}}"
      included_file_extensions: "{{steps.prepare_query.outputs.included_file_extensions}}"

  - id: select_candidates
    depends_on: [present_candidates]
    prompt: |
      Select only repository candidates whose names and descriptions indicate that their source may implement the same responsibility or logical sequence as the reviewed target. Do not classify candidates or claim a finding yet. Return an empty selection when none of the summaries is promising.

      For each selected candidate, copy its `path` and `unit` exactly and explain briefly why its summary warrants source inspection. You will read and classify the selected files in the next step.

      Reviewed target name: {{params.review_unit.target.name}}
      Reviewed target kind: {{params.review_unit.target.kind}}
      {{steps.present_candidates.outputs.text}}
    outputs:
      - name: selections
        type: data
        schema:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [path, unit, reasoning]
            properties:
              path: {type: string, minLength: 1}
              unit: {type: string, minLength: 1}
              reasoning: {type: string, minLength: 1}

  - id: present_candidates
    type: operation
    operation: source.present_search
    depends_on: [search_repository]
    with:
      candidates: "{{steps.search_repository.outputs.candidates}}"
      files_scanned: "{{steps.search_repository.outputs.files_scanned}}"

  - id: validate_selection
    type: operation
    operation: source.validate_candidate_selection
    depends_on: [select_candidates]
    with:
      candidates: "{{steps.search_repository.outputs.candidates}}"
      selections: "{{steps.select_candidates.outputs.selections}}"

  - include:
      workflow: dry-candidate-review
    as: candidate_reviews
    depends_on: [validate_selection]
    for_each: "{{steps.validate_selection.outputs.selected_candidates}}"
    with:
      target: "{{params.review_unit.target}}"
      candidate: "{{item}}"

  - id: reuse_misses
    type: metric
    metric_id: DRY-1
    depends_on: [candidate_reviews]
    prompt: |
      1. **Identify the responsibility** of each new or modified code unit — what does it do? What problem does it solve? This includes:
         - A new type or function (any access level)
         - A private view or view builder that composes a layout
         - A computed property that transforms or formats data
         - An inline expression that could be wrapped by an existing convenience
         - An object that provides functionality another object already provides
      2. **Search the codebase** for existing code that serves the same responsibility:
         - Generate synonyms for the name and its responsibility (3 per keyword)
         - Search by name variants, method signatures, protocol conformances, variable types, and relationships
         - Search extensions on types being used — convenience wrappers are commonly missed
         - Search shared/common directories and design system modules for equivalent components, views, or layouts
      3. **Classify matches:**
         - EXACT — existing code covers 100% of the need, could be used directly
         - EXTENSIBLE — existing code covers the core need, could be extended (via protocol extension, overload, or configuration) to cover the rest
         - PARTIAL — existing code covers some overlap but serves a genuinely different purpose
      4. **Count** EXACT and EXTENSIBLE matches that were not reused = reuse misses

      Use only each repository candidate's `reuse` classification for this metric. Count EXACT and EXTENSIBLE reuse decisions; do not infer reuse from the independent `duplication` classification. Return the count only through the metric output schema.

      Apply this metric to unit `{{params.review_unit.target.name}}` using the source and repository classifications already visible in the current model session.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: duplicate_sites
    type: metric
    metric_id: DRY-2
    depends_on: [candidate_reviews]
    prompt: |
      1. **For each function or method** in the unit under review, identify its logical sequence — what operations does it perform, in what order?
      2. **Search other units in the same module/target** for methods with the same logical sequence:
         - Same control flow structure (if/else, guard, switch patterns)
         - Same operation ordering (fetch → validate → transform → persist)
         - Same algorithm with different concrete types
      3. **Classify matches:**
         - IDENTICAL — same logic, same types, different names only
         - STRUCTURAL — same algorithm, different types (candidate for generics)
         - SIMILAR — overlapping logic with meaningful differences (not a violation)
      4. **Count** IDENTICAL and STRUCTURAL matches = inlined duplications

      Independently inspect the reviewed unit for IDENTICAL or STRUCTURAL logical sequences repeated across its own methods, helpers, or expressions. Count every participating implementation location once; two methods that contain the same sequence therefore contribute two duplicate sites even when repository search returns no candidates.

      Also consume each selected repository candidate's independent `duplication` classification. Count each candidate source location classified IDENTICAL or STRUCTURAL once, after deduplicating the same location across repository evidence. Do not infer duplication from the independent `reuse` classification, and do not count pairs, SIMILAR findings, declarations, signatures, or protocol requirements without implemented logic. Return the combined within-unit and repository location count only through the metric output schema.

      Apply this metric to unit `{{params.review_unit.target.name}}` using the source and repository classifications already visible in the current model session.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 2

  - id: missing_abstractions
    type: metric
    metric_id: DRY-3
    depends_on: [candidate_reviews]
    prompt: |
      1. **Identify the domain** of the type under review — what business concept does it represent?
      2. **Identify generic patterns** within the type — behavior, layout, or creation logic that is not specific to the domain:
         - Behavioral patterns (retry, queue, cache, observe, poll — any reusable flow)
         - Object creation patterns (similar initialization sequences, builder logic, factory patterns repeated across types)
         - UI composition patterns (recurring view structures, repeated styling + layout combinations, common interactive elements with shared behavior)
         - Data flow patterns (transform pipelines, validation chains, mapping sequences)
      3. **Assess reuse potential** — could another part of the codebase need this same pattern?
         - If YES → missing abstraction
         - If NO (the pattern is inherently domain-specific) → not a violation
      4. **Count** missing abstractions

      Use both completed analysis lanes. Return the count only through the metric output schema.

      Apply this metric to unit `{{params.review_unit.target.name}}` using the source and repository classifications already visible in the current model session.
    value:
      type: integer
      minimum: 0
    scoring:
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: classify_exception
    type: exception
    depends_on: [candidate_reviews]
    prompt: |
      Decide whether all apparent DRY findings for the supplied unit are exempt under these authored exceptions. Candidate-level exceptions must be excluded from metric evidence before counting. Mark the entire unit as an exception only when every apparent finding is exempt.

      1. **Intentionally specialized** — same shape but genuinely different domain semantics (e.g., two validation functions that happen to have similar structure but validate different business rules)
      2. **Configuration/constants** — repeated literal values that are intentionally independent (changing one should NOT change the other)
      3. **Protocol default implementations** — providing defaults for convenience is not duplication even if the body resembles another conformer

      Classify unit `{{params.review_unit.target.name}}` using the source, within-unit analysis, and repository classifications already visible in the current model session.
