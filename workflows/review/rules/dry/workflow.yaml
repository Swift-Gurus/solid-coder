id: dry
name: Don't Repeat Yourself Review
description: Measures reuse misses and duplicated source sites from local and repository comparisons.
max_turns: 60

rule: {}

steps:
  - id: generate_terms
    prompt: |
      Generate semantic search terms for reviewed unit `{{params.review_unit.target.name}}` using its source already visible in the current model session.

      Return only individual synonyms or name components that may identify existing code with the same responsibility or logical behavior. Do not inspect files, invent paths, create an ID, repeat deterministic names, classify candidates, count findings, or decide severity. Each term must be exactly one lexical word without whitespace, commas, semicolons, regular expressions, or shell syntax. Do not return compound type or method names: for `RemoteResourceLoader`, return `remote`, `resource`, and `loader`; never return the compound name.

      Target name: {{params.review_unit.target.name}}
      Target kind: {{params.review_unit.target.kind}}
    outputs:
      - name: generated_terms
        type: data
        schema:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}

  - id: prepare_query
    type: operation
    operation: source.prepare_search_query
    depends_on: [generate_terms]
    with:
      target: "{{params.review_unit.target}}"
      generated_terms: "{{steps.generate_terms.outputs.generated_terms}}"

  - id: search_repository
    type: operation
    operation: source.search
    depends_on: [prepare_query]
    with:
      queries: "{{steps.prepare_query.outputs.queries}}"
      excluded_units: "{{steps.prepare_query.outputs.excluded_units}}"
      context: "{{params.source_context}}"
      included_file_extensions: "{{steps.prepare_query.outputs.included_file_extensions}}"

  - id: select_candidates
    depends_on: [present_candidates]
    prompt: |
      Account for every repository candidate shown below. Return exactly one disposition for every `candidate_id`, copying that ID exactly.

      Use `INSPECT` when the candidate name and description indicate that its source may implement the same responsibility or logical sequence as the reviewed target. You will read and classify that candidate in the next step. Use `REJECT` when the metadata establishes that source inspection is not warranted. For both dispositions, explain the decision and cite evidence from the shown candidate name or description. Do not read source, classify reuse or duplication, claim a finding, omit an ID, or invent an ID. An empty search result requires an empty disposition list.

      Reviewed target name: {{params.review_unit.target.name}}
      Reviewed target kind: {{params.review_unit.target.kind}}
      {{steps.present_candidates.outputs.text}}
    outputs:
      - name: dispositions
        type: data
        schema:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, disposition, reasoning, evidence]
            properties:
              candidate_id:
                type: string
                pattern: "^candidate-[1-9][0-9]*$"
              disposition:
                type: string
                enum: [INSPECT, REJECT]
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: present_candidates
    type: operation
    operation: source.present_search
    depends_on: [search_repository]
    with:
      candidates: "{{steps.search_repository.outputs.candidates}}"
      files_scanned: "{{steps.search_repository.outputs.files_scanned}}"

  - id: validate_selection
    type: operation
    operation: source.validate_candidate_selection
    depends_on: [select_candidates]
    with:
      candidates: "{{steps.search_repository.outputs.candidates}}"
      dispositions: "{{steps.select_candidates.outputs.dispositions}}"

  - include:
      workflow: dry-candidate-review
    as: candidate_reviews
    depends_on: [validate_selection]
    for_each: "{{steps.validate_selection.outputs.selected_candidates}}"
    with:
      target: "{{params.review_unit.target}}"
      candidate: "{{item}}"

  - id: analyze_target_patterns
    depends_on: [candidate_reviews]
    prompt: |
      Analyze reviewed unit `{{params.review_unit.target.name}}` for within-unit
      duplication. Its source is already visible in the
      current model session. Do not search the repository, inspect candidate
      files, count observations, or choose severity.

      For within-unit duplication:

      Compare the algorithm separately from its business-domain names.
      The same sequence of validation, calculation, and transformation remains
      structurally duplicated when its differences can be expressed as parameters,
      including different constants or rounding precision.

      1. **For each function or method** in the unit under review, identify its logical sequence — what operations does it perform, in what order?
      2. **Compare methods within the reviewed unit** for the same logical sequence:
         - Same control flow structure (if/else, guard, switch patterns)
         - Same operation ordering (fetch → validate → transform → persist)
         - Same algorithm with different concrete types or parameterizable values
      3. **Classify matches:**
         - IDENTICAL — same logic, same types, different names only
         - STRUCTURAL — same algorithm with different types or parameterizable values
         - SIMILAR — overlapping logic with meaningful differences (not a violation)

      Return one `within_unit_duplicates` observation for every participating
      implementation location classified IDENTICAL or STRUCTURAL. Two methods
      containing one repeated sequence therefore produce two observations. Use
      a stable source location such as `Current.swift:Type.method` and do not
      return SIMILAR or declaration-only observations.

      For every returned observation, set `is_exception` only when that specific
      finding matches one of these authored DRY exceptions:

      1. Intentionally specialized behavior with genuinely different domain semantics.
      2. Configuration or constants that must remain independently changeable.
      3. A protocol default implementation supplied only for conformance convenience.

      Apply the intentional-specialization exception when evidence establishes
      independently evolving business rules.
      Different names or constants alone do not establish that exception.

      Supply independent reasoning and source evidence for every observation.
    outputs:
      - name: within_unit_duplicates
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, classification, is_exception, reasoning, evidence]
            properties:
              location: {type: string, minLength: 1}
              classification:
                type: string
                enum: [IDENTICAL, STRUCTURAL]
              is_exception: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}
      - name: additional_info
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [reasoning, evidence]
          properties:
            reasoning:
              type: string
              minLength: 1
              description: >-
                Assessment of within-unit duplication, including why the
                collection is empty.
            evidence:
              type: string
              minLength: 1
              description: >-
                Source locations or code excerpts supporting the assessment,
                including when no observations are returned.

  - id: reuse_misses
    type: metric
    metric_id: DRY-1
    observation_id: repository_reuse_miss_count
    depends_on: [candidate_reviews]
    value:
      type: integer
      minimum: 0
    scoring:
      source: "{{workflows.candidate_reviews.outputs.assessment}}"
      when:
        all:
          - any:
              - ref: "{{item.reuse.classification}}"
                equals: EXACT
              - ref: "{{item.reuse.classification}}"
                equals: EXTENSIBLE
              - ref: "{{item.reuse.classification}}"
                equals: PARTIAL
          - ref: "{{item.reuse.is_exception}}"
            equals: false
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: repository_duplicate_sites
    type: metric
    metric_id: DRY-2
    observation_id: repository_duplicate_location_count
    depends_on: [candidate_reviews]
    value:
      type: integer
      minimum: 0
    scoring:
      source: "{{workflows.candidate_reviews.outputs.assessment}}"
      when:
        all:
          - any:
              - ref: "{{item.duplication.classification}}"
                equals: IDENTICAL
              - ref: "{{item.duplication.classification}}"
                equals: STRUCTURAL
          - ref: "{{item.duplication.is_exception}}"
            equals: false
      reducer:
        type: distinct_count
        value: "{{item.location}}"
      severe:
        operator: greater_than_or_equal
        value: 1

  - id: within_unit_duplicate_sites
    type: metric
    metric_id: DRY-2
    observation_id: within_unit_duplicate_location_count
    depends_on: [analyze_target_patterns]
    value:
      type: integer
      minimum: 0
    scoring:
      source: "{{steps.analyze_target_patterns.outputs.within_unit_duplicates}}"
      when:
        ref: "{{item.is_exception}}"
        equals: false
      reducer:
        type: distinct_count
        value: "{{item.location}}"
      severe:
        operator: greater_than_or_equal
        value: 2

  - id: classify_exception
    type: exception
    depends_on:
      - reuse_misses
      - repository_duplicate_sites
      - within_unit_duplicate_sites
    prompt: |
      Decide whether all apparent DRY findings for the supplied unit are exempt under these authored exceptions. Mark the entire unit as an exception only when every apparent finding is exempt.

      1. **Intentionally specialized** — same shape but genuinely different domain semantics (e.g., two validation functions that happen to have similar structure but validate different business rules)
      2. **Configuration/constants** — repeated literal values that are intentionally independent (changing one should NOT change the other)
      3. **Protocol default implementations** — providing defaults for convenience is not duplication even if the body resembles another conformer

      Apply the intentional-specialization exception when evidence establishes
      independently evolving business rules.
      Different names or constants alone do not establish that exception.

      Classify unit `{{params.review_unit.target.name}}` using the source, within-unit analysis, and repository classifications already visible in the current model session.
