id: structured-concurrency
name: Structured Concurrency Review
description: Classifies concurrency facts for deterministic lifecycle, safety, parallelism, bridging, and duration scoring.
max_turns: 16

rule:
  match:
    file_extensions:
      included: [.swift]
    tags:
      included: [structured-concurrency]

steps:
  - id: classify_concurrency_models
    type: agent
    prompt: |
      Classify the concurrency models used by unit
      `{{params.review_unit.target.name}}`, whose source is already visible
      in this session.

      Identify whether the type uses async functions, GCD dispatch, or
      asynchronously invoked completion handlers. An ordinary closure is not
      necessarily an asynchronous completion handler.

      Classify legacy_bridge_only as true only when every GCD or asynchronous
      callback usage is confined to a necessary bridge to an API without an
      available native async alternative. A bridge does not exempt unrelated
      dispatch or callback behavior elsewhere in the type.

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: models
        type: data
        schema_file: concurrency-models.schema.json

  - id: model_mixing
    type: metric
    metric_id: SC-1
    depends_on: [classify_concurrency_models]
    when:
      ref: "{{steps.classify_concurrency_models.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: Concurrency-model usage or the scope of a necessary legacy bridge could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_concurrency_models.outputs.models}}"
      when:
        all:
          - ref: "{{item.has_async}}"
            equals: true
          - any:
              - ref: "{{item.has_gcd}}"
                equals: true
              - ref: "{{item.has_async_callbacks}}"
                equals: true
          - ref: "{{item.legacy_bridge_only}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_task_lifecycle
    type: agent
    prompt: |
      Classify task creation in unit `{{params.review_unit.target.name}}`,
      whose source is already visible in this session.

      For each Task, Task.detached, or SwiftUI .task, classify its kind,
      whether its handle is retained by its owner, whether that owner has
      a cancellation path, and whether it belongs to test code.

      A cancellation path connects the retained task to deinit, onDisappear,
      or an applicable cleanup method. An unrelated cancel call is not enough.

      SwiftUI's .task modifier has framework-managed cancellation. A separate
      Task or Task.detached created inside its closure does not inherit that
      lifecycle management. Test code is exempt from task lifecycle checks.

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: tasks
        type: data
        schema_file: task-lifecycle.schema.json

  - id: orphaned_tasks
    type: metric
    metric_id: SC-2
    depends_on: [classify_task_lifecycle]
    when:
      ref: "{{steps.classify_task_lifecycle.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: Task ownership, cancellation, or test context could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_task_lifecycle.outputs.tasks}}"
      when:
        all:
          - ref: "{{item.kind}}"
            in: [TASK, DETACHED_TASK]
          - ref: "{{item.is_test_code}}"
            equals: false
          - any:
              - ref: "{{item.has_stored_handle}}"
                equals: false
              - ref: "{{item.has_cancellation_path}}"
                equals: false
      reducer: {type: distinct_count, value: "{{item.location}}"}
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_safety_bypasses
    type: agent
    prompt: |
      Classify every @unchecked Sendable and nonisolated(unsafe) annotation
      in unit `{{params.review_unit.target.name}}`, whose source is already
      visible in this session.

      Identify the annotation kind and whether the annotated type itself
      implements a synchronization primitive using OS-level constructs.
      Merely containing a lock does not make a business type a
      synchronization primitive.

      Mutable state can be stored inside a lock-owned state value, including
      OSAllocatedUnfairLock<State> held in a let property. Classify the
      synchronization behavior, not merely the presence of let or var.
      Lock-owned state without a bypass annotation is not a bypass observation.

      The synchronization-primitive exception applies to @unchecked Sendable,
      not to nonisolated(unsafe).

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: bypasses
        type: data
        schema_file: safety-bypasses.schema.json

  - id: safety_bypasses
    type: metric
    metric_id: SC-3
    depends_on: [classify_safety_bypasses]
    when:
      ref: "{{steps.classify_safety_bypasses.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: Safety-bypass annotations or synchronization-primitive ownership could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_safety_bypasses.outputs.bypasses}}"
      when:
        any:
          - ref: "{{item.kind}}"
            equals: NONISOLATED_UNSAFE
          - all:
              - ref: "{{item.kind}}"
                equals: UNCHECKED_SENDABLE
              - ref: "{{item.is_synchronization_primitive}}"
                equals: false
      reducer: {type: distinct_count, value: "{{item.location}}"}
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_sequential_awaits
    type: agent
    prompt: |
      Classify await calls in unit `{{params.review_unit.target.name}}`,
      whose source is already visible in this session.

      For each call, identify whether it has another sequential await in
      the same function or closure scope. Classify whether running it
      concurrently with those calls is constrained by a data dependency,
      required ordering, or conflicting shared-state effects.

      A data dependency includes producing a result consumed by another
      call or consuming another call's result. Absence of a result dependency
      alone does not establish independence.

      Independence preserves synchronization and timing order as well as
      returned values. A synchronization wait separates the await sequences
      before and after it. Moving a delay ahead of preceding work changes
      when that delay starts; classify that timing relationship as required
      ordering unless the source establishes that overlap is intended.

      Keep one observation per await call, rather than per pair of calls.
      The location identifies that source occurrence.

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: awaits
        type: data
        schema_file: sequential-awaits.schema.json

  - id: independent_sequential_awaits
    type: metric
    metric_id: SC-4
    depends_on: [classify_sequential_awaits]
    when:
      ref: "{{steps.classify_sequential_awaits.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: Sequential-await dependencies, required ordering, or shared-state effects could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_sequential_awaits.outputs.awaits}}"
      when:
        all:
          - ref: "{{item.has_sequential_peer}}"
            equals: true
          - ref: "{{item.has_data_dependency}}"
            equals: false
          - ref: "{{item.requires_ordering}}"
            equals: false
          - ref: "{{item.has_conflicting_effects}}"
            equals: false
      reducer: {type: distinct_count, value: "{{item.location}}"}
      severe: {operator: greater_than_or_equal, value: 3}

  - id: classify_bridges
    type: agent
    prompt: |
      Classify blocking waits and continuations in unit
      `{{params.review_unit.target.name}}`, whose source is already visible
      in this session.

      For each synchronous blocking wait, classify whether it blocks
      asynchronous execution or waits synchronously for an async result.
      Relevant mechanisms include DispatchSemaphore.wait, DispatchGroup.wait,
      and running a RunLoop to wait for completion.

      For each checked or unsafe continuation, classify whether a native
      async API is available for the wrapped operation and whether every
      execution path resumes the continuation exactly once.

      A necessary legacy bridge has no available native async alternative.
      It still must resume exactly once and must not block async execution.

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: bridges
        type: data
        schema_file: bridges.schema.json

  - id: blocking_bridges
    type: metric
    metric_id: SC-5
    depends_on: [classify_bridges]
    when:
      ref: "{{steps.classify_bridges.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: Blocking behavior, native async availability, or continuation resumption could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_bridges.outputs.bridges}}"
      when:
        any:
          - all:
              - ref: "{{item.kind}}"
                equals: BLOCKING_WAIT
              - ref: "{{item.blocks_async_execution}}"
                equals: true
          - all:
              - ref: "{{item.kind}}"
                equals: CONTINUATION
              - any:
                  - ref: "{{item.native_async_available}}"
                    equals: true
                  - ref: "{{item.resumes_exactly_once}}"
                    equals: false
      reducer: {type: distinct_count, value: "{{item.location}}"}
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_durations
    type: agent
    prompt: |
      Classify duration uses in unit `{{params.review_unit.target.name}}`,
      whose source is already visible in this session.

      For each timeout, delay, interval, or sleep, identify whether it uses
      Task.sleep(nanoseconds:) or a raw integer time duration where a
      Duration-based representation is available.

      Numeric values constructing a Duration, such as .seconds(2), are typed
      durations rather than raw duration uses. An unrelated integer is not
      a duration observation. Keep one observation per source use.

      Use VERIFIED when the evidence supports the complete classification.
      Otherwise use UNABLE_TO_VERIFY with the missing evidence explained.
    outputs:
      - name: verification
        type: data
        schema_file: verification.schema.json
      - name: durations
        type: data
        schema_file: durations.schema.json

  - id: raw_duration_count
    type: metric
    metric_id: SC-6
    depends_on: [classify_durations]
    when:
      ref: "{{steps.classify_durations.outputs.verification.status}}"
      equals: VERIFIED
    unavailable_reason: The meaning of a duration value or availability of a typed duration representation could not be verified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_durations.outputs.durations}}"
      when:
        any:
          - ref: "{{item.uses_nanosecond_sleep}}"
            equals: true
          - ref: "{{item.is_raw_integer_duration}}"
            equals: true
      reducer: {type: distinct_count, value: "{{item.location}}"}
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_exception
    type: exception
    depends_on:
      - model_mixing
      - orphaned_tasks
      - safety_bypasses
      - independent_sequential_awaits
      - blocking_bridges
      - raw_duration_count
    prompt: |
      This rule has no rule-wide exception. For unit
      `{{params.review_unit.target.name}}`, classify is_exception as false.
      Necessary bridges, framework-managed task lifecycles, test lifecycle
      checks, and synchronization primitives are handled only by their
      corresponding metric conditions. They do not exempt unrelated metrics.
