id: isp-candidate-review
name: ISP Conformer Evidence
description: Matches requirements in MCP and classifies one bounded conformer candidate without model-owned arithmetic.
max_turns: 5

outputs:
  - name: availability
    type: data
    value: "{{steps.classify_candidate.outputs.availability}}"
    schema: &availability_schema
      type: object
      additionalProperties: false
      required: [observation_id, matches, included, reasoning, evidence]
      properties:
        observation_id: {type: string, minLength: 1}
        matches: {type: boolean}
        included: {type: boolean}
        reasoning: {type: string, minLength: 1}
        evidence: {type: string, minLength: 1}
  - name: coverage
    type: data
    value: "{{steps.coverage_ratio.outputs.value}}"
    schema: {type: number, minimum: 0, maximum: 1}

steps:
  - id: match
    type: operation
    operation: source.match_requirements
    with:
      inventory: "{{params.inventory}}"
      relationship: "{{params.candidate.relationship}}"

  - id: classify_candidate
    depends_on: [match]
    prompt: |
      Assess "{{params.candidate.declaration.name}}" against protocol
      "{{params.protocol_name}}".
      Source: {{params.candidate.relationship.reference.owner.source_identity}}

      Use the source already visible in this session or your normal file-reading
      tool to inspect relevant implementation bodies, including related
      extensions and protocol defaults. The supplied structural matches are
      bounded candidates, not proof of conformance or implementation absence:
      {{steps.match.outputs.matches}}

      A conformer with low coverage is being forced to depend on methods it
      does not use. For every directly declared requirement, classify behavior:
      MEANINGFUL contains real logic; EMPTY has an empty body; STUB returns a
      hardcoded default, traps, or ignores the contract; DELEGATED forwards to
      another object; MISSING is a verified absence in the inspected source.
      An unresolved structural match alone does not prove MISSING.

      Return one coverage entry per requirement, preserving its exact
      requirement identity in observation_id. matches is true for MEANINGFUL
      or DELEGATED, false for EMPTY, STUB, or verified MISSING. included is true.
      State the behavior classification in reasoning and cite the source.
      Use a protocol default only when it satisfies that requirement and the
      conformer does not override it with a non-meaningful implementation.
      Private/fileprivate helpers and extra conformer methods are not interface
      requirements and are not additional review targets.

      In availability, copy the candidate name into observation_id.
      included is false for test doubles, protocol declarations, or candidates
      that do not conform; return no coverage entries for those candidates.
      matches is true only when all required implementation evidence can be
      verified. If a source cannot be read or ownership/dispatch remains
      ambiguous, set matches false, explain why with evidence, and return no
      coverage entries. A single conformer never receives artificial coverage.
    outputs:
      - name: availability
        type: data
        schema: *availability_schema
      - name: coverage_entries
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [observation_id, matches, included, reasoning, evidence]
            properties:
              observation_id: {type: string, minLength: 1}
              matches: {type: boolean}
              included: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: coverage_ratio
    type: operation
    operation: collection.ratio
    depends_on: [classify_candidate]
    with:
      observations: "{{steps.classify_candidate.outputs.coverage_entries}}"
