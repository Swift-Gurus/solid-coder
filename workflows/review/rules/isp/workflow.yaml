id: isp
name: Interface Segregation Principle Review
description: Measures protocol width, conformer coverage, and cohesion groups from complete repository evidence.
max_turns: 40

rule:
  match:
    unit_kinds:
      included: [protocol]

steps:
  - id: analyze_protocol
    prompt: |
      Analyze only protocol `{{params.review_unit.target.name}}` in the source
      already visible in this model session. Do not inspect repository
      candidates, count metrics, calculate coverage, or decide severity.

      A "wide" protocol forces conformers to implement methods they do not need. Each unnecessary method is a coupling point that creates implementation burden and fragility.

      1. **List every method and property** declared in the protocol (including associated types)
      2. **Count total requirements** (methods + properties + associated types)
      3. **Exclude inherited requirements** — only count what THIS protocol declares, not parent protocols

      Return one requirement record for every declaration and every default
      implementation visible with this protocol. Preserve source evidence so
      later candidate and metric steps reuse this exact analysis.
    outputs:
      - name: requirements
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, evidence]
            properties:
              name: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}
      - name: default_implementations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [requirement, evidence]
            properties:
              requirement: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: prepare_conformer_query
    type: operation
    operation: source.prepare_search_query
    with:
      target: "{{params.review_unit.target}}"
      generated_terms: "{{params.review_unit.target.deterministic_terms}}"

  - id: search_conformers
    type: operation
    operation: source.search
    depends_on: [prepare_conformer_query]
    with:
      queries: "{{steps.prepare_conformer_query.outputs.queries}}"
      excluded_units: "{{steps.prepare_conformer_query.outputs.excluded_units}}"
      context: "{{params.source_context}}"
      included_file_extensions: "{{steps.prepare_conformer_query.outputs.included_file_extensions}}"

  - id: present_candidates
    type: operation
    operation: source.present_search
    depends_on: [search_conformers]
    with:
      candidates: "{{steps.search_conformers.outputs.candidates}}"
      files_scanned: "{{steps.search_conformers.outputs.files_scanned}}"

  - id: select_candidates
    depends_on: [present_candidates]
    prompt: |
      Account for every repository candidate shown below. Return exactly one
      disposition for every `candidate_id`, copying that ID exactly.

      Use INSPECT when the candidate may conform to protocol
      `{{params.review_unit.target.name}}` or may supply protocol-extension
      defaults. Use REJECT only when its name and frontmatter description prove
      it cannot do either. For both dispositions, explain the decision and cite
      evidence from the shown metadata. Do not read source, classify a
      conformer, omit an ID, invent an ID, count metrics, or decide severity.
      An empty search result requires an empty disposition list.

      {{steps.present_candidates.outputs.text}}
    outputs:
      - name: dispositions
        type: data
        schema:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, disposition, reasoning, evidence]
            properties:
              candidate_id:
                type: string
                pattern: "^candidate-[1-9][0-9]*$"
              disposition:
                type: string
                enum: [INSPECT, REJECT]
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: validate_selection
    type: operation
    operation: source.validate_candidate_selection
    depends_on: [select_candidates]
    with:
      candidates: "{{steps.search_conformers.outputs.candidates}}"
      dispositions: "{{steps.select_candidates.outputs.dispositions}}"

  - include:
      workflow: isp-candidate-review
    as: candidate_reviews
    depends_on: [analyze_protocol, validate_selection]
    for_each: "{{steps.validate_selection.outputs.selected_candidates}}"
    with:
      candidate: "{{item}}"
      protocol_name: "{{params.review_unit.target.name}}"

  - id: analyze_cohesion
    depends_on: [candidate_reviews]
    prompt: |
      Analyze protocol `{{params.review_unit.target.name}}` using only the
      protocol and complete candidate assessments already submitted in this
      model session. Do not inspect source again, omit a requirement, count
      groups, calculate metrics, or decide severity.

      Group protocol methods by which conformers actually use them together. Disjoint groups suggest the protocol should be split.

      1. **Build a usage matrix**: for each conformer, which methods are MEANINGFUL
      2. **Identify groups of methods** that are always used together across conformers
      3. **Count groups** — if methods cluster into 2+ disjoint usage groups, the protocol mixes responsibilities

      Return exactly one record for every declared requirement, in declaration
      order. Encode its binary implementation vector in conformer source order:
      use `1` for MEANINGFUL or DELEGATED and `0` for EMPTY, STUB, or MISSING.
      Requirements with identical vectors have the same `usage_vector`. MCP will
      count distinct vectors; do not return a derived group count.
    outputs:
      - name: requirement_groups
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [requirement, usage_vector, reasoning, evidence]
            properties:
              requirement: {type: string, minLength: 1}
              usage_vector: {type: string, minLength: 1}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: width
    type: metric
    metric_id: ISP-1
    depends_on: [analyze_protocol]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_protocol.outputs.requirements}}"
      minor: {operator: greater_than_or_equal, value: 6}
      severe: {operator: greater_than_or_equal, value: 9}

  - id: min_coverage
    type: metric
    metric_id: ISP-2
    depends_on: [candidate_reviews]
    value: {type: number, minimum: 0, maximum: 1}
    scoring:
      source: "{{workflows.candidate_reviews.outputs.coverage}}"
      reducer:
        type: minimum
        value: "{{item}}"
        empty_value: 1.0
      minor: {operator: less_than, value: 0.8}
      severe: {operator: less_than, value: 0.6}

  - id: cohesion_groups
    type: metric
    metric_id: ISP-3
    depends_on: [analyze_cohesion]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_cohesion.outputs.requirement_groups}}"
      reducer:
        type: distinct_count
        value: "{{item.usage_vector}}"
      severe: {operator: greater_than_or_equal, value: 2}

  - id: classify_exception
    type: exception
    depends_on:
      - width
      - min_coverage
      - cohesion_groups
      - candidate_reviews
    prompt: |
      Decide whether the entire supplied protocol is exempt from ISP review.
      Single-conformer and default-implementation criteria adjust only ISP-2
      and do not exempt ISP-1 or ISP-3. Apply this complete authored list:

      1. **Non-protocol units** — ISP applies ONLY to protocol/interface declarations. Classes, structs, enums, extensions, and standalone functions that do not declare a protocol are outside ISP scope — do NOT include them in the ISP section of the submission. Omit these units from ISP metrics entirely. Conformers are examined only as evidence during ISP-2 (coverage analysis) of the protocol they conform to, not as ISP review targets themselves.
      2. **Marker protocols** — protocols with zero requirements used for type discrimination (e.g., `Sendable`, `Identifiable`). Width = 0 is always COMPLIANT.
      3. **Single-conformer protocols** — if only one conformer exists in the project, coverage is trivially 100%. Not a violation, but flag as "unable to verify ISP — single conformer." The protocol may still be too wide, but there is no evidence from usage.
      4. **Composition protocols** — protocols defined as `protocol P: A, B {}` (or `typealias P = A & B`) where A and B are already narrow. The composition itself is not a violation if each component protocol is compliant. **Prefer `protocol P: A, B {}` over `typealias`** — a typealias cannot be conformed to directly (you cannot write `class Decorator: MyTypealias`), which breaks the decorator pattern and other composition patterns that need a single nominal type to conform to.
      5. **@objc protocols** — Objective-C interop protocols may require specific method sets dictated by the framework. Flag as "framework-constrained" rather than violation.
      6. **Protocols with default implementations** — if all non-meaningful methods have default implementations via protocol extensions, conformers are not forced to implement them. Check whether the conformer overrides the default — if not, the default satisfies ISP.
      7. **Test code** — mocks, stubs, fakes, test helpers, and test doubles are exempt. They intentionally implement only the subset of a protocol needed for a specific test scenario. Low coverage in test conformers is expected and not a violation.

      Use only the completed protocol analysis, candidate assessments, and
      deterministic metric results. Do not inspect source again, recalculate a
      metric, or revise an earlier classification.
