id: isp
name: Interface Segregation Principle Review
description: Measures exposed interface width, conformer coverage, usage cohesion, and extension responsibilities from bounded repository evidence.
max_turns: 40

rule:
  match:
    unit_kinds:
      included: [protocol]

steps:
  - id: discover
    type: operation
    operation: source.discover_declaration
    with:
      target: "{{params.review_unit.target}}"
      context: "{{params.source_context}}"

  - id: members
    type: operation
    operation: source.declaration_members
    depends_on: [discover]
    with:
      inventory: "{{steps.discover.outputs.inventory}}"
      declaration: "{{steps.discover.outputs.declaration}}"

  - id: unresolved_members
    type: operation
    operation: collection.count
    depends_on: [members]
    for_each: "{{steps.members.outputs.members}}"
    when:
      all:
        - ref: "{{item.role}}"
          equals: unresolved
        - ref: "{{item.reference.member.visibility}}"
          not_in: [private, fileprivate]
    with:
      values: "{{item.matching_declarations}}"

  - id: width
    type: metric
    metric_id: ISP-1
    depends_on: [members, unresolved_members]
    when:
      all:
        - ref: "{{steps.discover.outputs.limitations}}"
          equals: []
        - any: &no_unresolved_members
            - ref: "{{steps.unresolved_members.outputs.value}}"
              exists: false
            - ref: "{{steps.unresolved_members.outputs.value}}"
              equals: []
    unavailable_reason: Exposed interface width cannot be verified while discovery or member ownership remains incomplete.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.members.outputs.members}}"
      when:
        all:
          - ref: "{{item.role}}"
            in: [declared, additional]
          - ref: "{{item.reference.member.visibility}}"
            not_in: [private, fileprivate]
      minor: {operator: greater_than_or_equal, value: 6}
      severe: {operator: greater_than_or_equal, value: 9}

  - include:
      workflow: isp-candidate-review
    as: candidate_reviews
    depends_on: [discover]
    for_each: "{{steps.discover.outputs.related_declarations}}"
    with:
      candidate: "{{item}}"
      inventory: "{{steps.discover.outputs.inventory}}"
      protocol_name: "{{params.review_unit.target.name}}"

  - id: availability
    type: operation
    operation: collection.ratio
    depends_on: [candidate_reviews]
    with:
      observations: "{{workflows.candidate_reviews.outputs.availability}}"

  - id: analyze_cohesion
    depends_on: [availability]
    when: &comparable_evidence
      all:
        - ref: "{{steps.discover.outputs.limitations}}"
          equals: []
        - ref: "{{steps.availability.outputs.value}}"
          equals: 1.0
        - ref: "{{steps.availability.outputs.denominator_count}}"
          not_in: [0, 1]
    prompt: |
      Group protocol methods by which conformers actually use them together.
      Disjoint groups suggest the protocol should be split.

      For interface "{{params.review_unit.target.name}}", use the completed
      conformer observations already in this session. Return one record for
      each directly declared requirement, in declaration order. Its usage
      vector records coverage across eligible conformers in discovery order:
      1 for a covered requirement and 0 for an uncovered requirement.
      Identical vectors describe requirements used together.

      Preserve the requirement identity, reasoning, and source evidence.
    outputs:
      - name: requirement_groups
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [requirement, usage_vector, reasoning, evidence]
            properties:
              requirement: {type: string, minLength: 1}
              usage_vector: {type: string, minLength: 1}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: min_coverage
    type: metric
    metric_id: ISP-2
    depends_on: [candidate_reviews, availability]
    when: *comparable_evidence
    unavailable_reason: Coverage requires at least two eligible conformers with verifiable requirement evidence and no discovery limitation.
    value: {type: number, minimum: 0, maximum: 1}
    scoring:
      source: "{{workflows.candidate_reviews.outputs.coverage}}"
      reducer:
        type: minimum
        value: "{{item}}"
        empty_value: 1.0
      minor: {operator: less_than, value: 0.8}
      severe: {operator: less_than, value: 0.6}

  - id: cohesion_groups
    type: metric
    metric_id: ISP-3
    depends_on: [analyze_cohesion, availability]
    when: *comparable_evidence
    unavailable_reason: Usage cohesion requires comparable, verifiable observations from at least two eligible conformers.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.analyze_cohesion.outputs.requirement_groups}}"
      reducer:
        type: distinct_count
        value: "{{item.usage_vector}}"
      severe: {operator: greater_than_or_equal, value: 2}

  - id: classify_extension_members
    depends_on: [members]
    for_each:
      source: "{{steps.members.outputs.members}}"
      mode: batch
      label: "{{item.reference.member.identity}}"
    when:
      all:
        - ref: "{{item.role}}"
          in: [implementation, additional]
        - ref: "{{item.reference.member.visibility}}"
          not_in: [private, fileprivate]
    prompt: |
      Classify extension member "{{item.reference.member.name}}" relative to
      interface "{{params.review_unit.target.name}}".
      Source: {{item.reference.owner.source_identity}}
      Declaration: {{item.reference.member.signature}}

      Inspect that member using the source already visible in this session,
      or your normal file-reading tool when necessary.
      SAME_RESPONSIBILITY serves the interface's responsibility.
      INDEPENDENT_RESPONSIBILITY introduces separate behavior.
      UNABLE_TO_VERIFY means the available source does not support a decision.

      Its structural role is "{{item.role}}": implementation supplies a
      declared requirement; additional introduces an exposed member.
      A default implementation is not independently a violation.
      Mark is_exception only when an applicable whole-interface exception
      below or a framework-mandated member explains this behavior. Preserve
      the applicable exception, reasoning, and evidence in additional_info.

      In availability, use the member identity as observation_id and included
      true. Set matches false for UNABLE_TO_VERIFY, otherwise true, and explain
      the evidence supporting that availability decision.
    outputs:
      - name: assessment
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [classification, is_exception, additional_info]
          properties:
            classification:
              type: string
              enum: [SAME_RESPONSIBILITY, INDEPENDENT_RESPONSIBILITY, UNABLE_TO_VERIFY]
            is_exception: {type: boolean}
            additional_info:
              type: object
              additionalProperties: false
              required: [reasoning, evidence]
              properties:
                reasoning: {type: string, minLength: 1}
                evidence: {type: string, minLength: 1}

      - name: availability
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [observation_id, matches, included, reasoning, evidence]
          properties:
            observation_id: {type: string, minLength: 1}
            matches: {type: boolean}
            included: {const: true}
            reasoning: {type: string, minLength: 1}
            evidence: {type: string, minLength: 1}

  - id: extension_availability
    type: operation
    operation: collection.ratio
    depends_on: [classify_extension_members]
    when:
      ref: "{{steps.classify_extension_members.outputs.availability}}"
      exists: true
    with:
      observations: "{{steps.classify_extension_members.outputs.availability}}"

  - id: mixed_responsibilities
    type: metric
    metric_id: ISP-4
    depends_on: [classify_extension_members, extension_availability, unresolved_members]
    when:
      all:
        - ref: "{{steps.discover.outputs.limitations}}"
          equals: []
        - any: *no_unresolved_members
        - any:
            - ref: "{{steps.extension_availability.outputs.value}}"
              exists: false
            - ref: "{{steps.extension_availability.outputs.value}}"
              equals: 1.0
    unavailable_reason: Extension responsibilities remain unverified because discovery, ownership, or a required behavioral classification is incomplete.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_extension_members.outputs.assessment}}"
      when:
        all:
          - ref: "{{item.classification}}"
            equals: INDEPENDENT_RESPONSIBILITY
          - ref: "{{item.is_exception}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_exception
    type: exception
    depends_on: [width, min_coverage, cohesion_groups, mixed_responsibilities]
    prompt: |
      Classify whether a whole-interface exception applies to
      "{{params.review_unit.target.name}}", with reasoning and source evidence.

      Marker protocols have zero requirements and serve type discrimination.
      Composition protocols are exempt when they only compose already narrow,
      compliant protocols. Prefer a nominal composition protocol to a typealias
      when direct conformance and decorators are needed.
      Framework-constrained @objc protocols may require specific method sets.
      Test code, mocks, stubs, fakes, and test helpers are exempt.

      These are not whole-interface exemptions:
      - Zero or one eligible conformer leaves usage evidence unable to verify;
        it does not make a wide interface compliant.
      - Protocol defaults affect coverage for the requirement they actually
        satisfy. They do not exempt additional extension behavior or width.
      - An unavailable metric is not a measured compliant result.
