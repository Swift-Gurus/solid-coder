id: frontmatter
name: Frontmatter Review
description: Validates source-backed metadata mechanically and classifies description quality for MCP scoring.
max_turns: 12

rule:
  scope: file
  exception:
    is_exception: false
    additional_info:
      reasoning: This rule has structural metric exclusions, not a rule-wide exception.
      evidence: FM-1 excludes short private helpers and conformance-only extensions without new members.

steps:
  - id: analyze_source
    type: operation
    operation: source.analyze_text
    with:
      text: "{{params.review_unit.target.code}}"
      virtual_path: "{{params.review_unit.target.source_identity}}"

  - id: prepare_frontmatter
    type: operation
    operation: source.prepare_frontmatter
    depends_on: [analyze_source]
    with:
      analysis: "{{steps.analyze_source.outputs.result}}"

  - id: classify_descriptions
    type: agent
    depends_on: [prepare_frontmatter]
    when: &complete_inventory
      ref: "{{steps.prepare_frontmatter.outputs.limitations}}"
      equals: []
    for_each:
      source: "{{steps.prepare_frontmatter.outputs.descriptions}}"
      mode: batch
      label: "{{item.label}}"
    prompt: |
      Classify the solid-description for declaration "{{item.name}}" in file
      "{{params.review_unit.target.name}}". Its source is already visible in this session.

      solid-description describes what the type does, when to use it, and what
      problem it solves, so someone searching for related concepts can find it.

      Classify as:
      - CAPABILITY: describes the capability at the interface level. Would the
        sentence still be true if the implementation changed entirely?
      - IMPLEMENTATION_DETAIL: names concrete implementation types, variables,
        APIs, values, colors, layout details, composition steps, or wiring.
      - VAGUE: lacks substance, such as "A view", "A service", or "Handles data".

      Declaration ID: {{item.declaration_id}}
      Category: {{item.category}}
      Description: {{item.description}}
    outputs:
      - name: classification
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [declaration_id, classification, additional_info]
          properties:
            declaration_id: {type: string, minLength: 1}
            classification: {enum: [CAPABILITY, IMPLEMENTATION_DETAIL, VAGUE]}
            additional_info:
              type: object
              additionalProperties: false
              required: [reasoning, evidence]
              properties:
                reasoning: {type: string, minLength: 1}
                evidence: {type: string, minLength: 1}

  - id: bind_descriptions
    type: operation
    operation: source.bind_frontmatter_descriptions
    depends_on: [classify_descriptions]
    when: *complete_inventory
    with:
      entries: "{{steps.prepare_frontmatter.outputs.entries}}"
      targets: "{{steps.prepare_frontmatter.outputs.descriptions}}"
      classifications: "{{steps.classify_descriptions.outputs.classification}}"

  - id: missing_frontmatter_count
    type: metric
    metric_id: FM-1
    depends_on: [prepare_frontmatter]
    when: *complete_inventory
    unavailable_reason: Metadata cannot be verified because source analysis or attached metadata is incomplete or malformed.
    value: &count_value {type: integer, minimum: 0}
    scoring:
      source: "{{steps.prepare_frontmatter.outputs.entries}}"
      when:
        all:
          - ref: "{{item.has_frontmatter}}"
            equals: false
          - ref: "{{item.missing_exempt}}"
            equals: false
      severe: &severe {operator: greater_than_or_equal, value: 1}

  - id: name_mismatch_count
    type: metric
    metric_id: FM-2
    depends_on: [prepare_frontmatter]
    when: *complete_inventory
    unavailable_reason: Metadata names cannot be verified because the source or metadata inventory is incomplete.
    value: *count_value
    scoring:
      source: "{{steps.prepare_frontmatter.outputs.entries}}"
      when:
        all:
          - ref: "{{item.has_frontmatter}}"
            equals: true
          - ref: "{{item.name_matches}}"
            equals: false
      severe: *severe

  - id: invalid_category_count
    type: metric
    metric_id: FM-3
    depends_on: [prepare_frontmatter]
    when: *complete_inventory
    unavailable_reason: Metadata categories cannot be verified because the source or metadata inventory is incomplete.
    value: *count_value
    scoring:
      source: "{{steps.prepare_frontmatter.outputs.entries}}"
      when:
        all:
          - ref: "{{item.has_frontmatter}}"
            equals: true
          - ref: "{{item.category_registered}}"
            equals: false
      severe: *severe

  - id: incorrect_stack_count
    type: metric
    metric_id: FM-4
    depends_on: [prepare_frontmatter]
    when: *complete_inventory
    unavailable_reason: Metadata stack tags cannot be verified because the source or metadata inventory is incomplete.
    value: *count_value
    scoring:
      source: "{{steps.prepare_frontmatter.outputs.entries}}"
      when:
        all:
          - ref: "{{item.has_frontmatter}}"
            equals: true
          - ref: "{{item.stack_matches}}"
            equals: false
      severe: *severe

  - id: bad_description_count
    type: metric
    metric_id: FM-5
    depends_on: [bind_descriptions]
    when: *complete_inventory
    unavailable_reason: Descriptions cannot be verified because the source or metadata inventory is incomplete.
    value: *count_value
    scoring:
      source: "{{steps.bind_descriptions.outputs.descriptions}}"
      when:
        not:
          ref: "{{item.classification}}"
          equals: CAPABILITY
      severe: *severe
