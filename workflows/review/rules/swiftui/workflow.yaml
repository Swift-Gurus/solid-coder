id: swiftui
name: SwiftUI Best Practices Review
description: Measures SwiftUI view complexity, purity, composition, testability, previews, accessibility, sizing, and isolation.
max_turns: 24

rule:
  match:
    file_extensions:
      included: [.swift]
    unit_kinds:
      included: [struct]
    tags:
      included: [swiftui, view]

steps:
  - id: classify_countable_observations
    type: agent
    prompt: |
      Analyze view unit `{{params.review_unit.target.name}}` from the source
      already visible in this session. Use only supplied MCP-owned repository
      evidence for cross-file callers, previews, and conformers. Apply every
      canonical detection procedure below.

      ## SUI-6 / SUI-7: Preview Containment and Coverage

      A view whose only purpose is visual validation in Xcode Previews must be
      declared inside a #Preview block or PreviewProvider, not at file scope.
      Production file-scope views need a preview for visual validation.

      Classify the reviewed view only, not every view in the file:
      - `is_preview`: this is preview-only code, such as a preview showcase or
        a view defined exclusively for preview infrastructure. A production
        view does not become preview-only merely because a preview uses it.
        A missing caller in the supplied context is not proof of preview-only
        use; classify its purpose from the code and available usage evidence.
      - `is_file_scope`: the reviewed declaration is at file scope rather than
        nested inside a #Preview, PreviewProvider, or another type.
      - `has_preview`: a #Preview or PreviewProvider instantiates this view in
        the supplied file or supplied cross-file evidence. This is independent
        of whether the view itself is preview-only.

      Return exactly one preview_facts record for the reviewed view. Report
      what the supplied source establishes; do not claim a repository-wide
      search occurred. Record incomplete or ambiguous preview evidence in
      preview_limitations rather than guessing. An empty limitations list
      means classification is complete for the supplied review context.
      These are context-bounded facts, not proof of every caller in the
      repository. Missing cross-file caller evidence alone is not a limitation
      when the supplied declaration establishes the view's purpose and scope.
      has_preview is false when no instantiation is present in the supplied
      evidence, without asserting that none exists elsewhere.

      ## SUI-8: Accessibility Identifier on Containers

      Container views are not exposed in the accessibility hierarchy by default. Applying `.accessibilityIdentifier(...)` alone is invisible to the accessibility tree — XCUI tests will fail to find the element. The container must first opt into the hierarchy with `.accessibilityElement(children: .contain)` (or `.combine`/`.ignore` depending on intent) before the identifier becomes discoverable.

      1. **Identify container views** — any `HStack`, `VStack`, `ZStack`, `LazyVStack`, `LazyHStack`, `LazyVGrid`, `LazyHGrid`, `List`, `ScrollView`, `Form`, or `Group` expression
      2. **For each container view with `.accessibilityIdentifier(...)`:**
         - Check if `.accessibilityElement(children:)` appears in the modifier chain **before** `.accessibilityIdentifier(...)`
         - If missing → VIOLATION
         - If present → COMPLIANT
      3. **Containers without `.accessibilityIdentifier(...)`** are not in scope — no finding

      ## SUI-9: Adaptive Sizing

      SwiftUI's layout system is built on a propose-respond model — parents propose sizes, children respond. Views that participate in layout should size proportionally or with constraints, not with hardcoded literal values. Fixed frames prevent adaptation to different window sizes, device orientations, Dynamic Type, and localization.

      There are two distinct violations:

      1. **Child self-sizing** — a child view hardcodes its own external dimensions internally (e.g., `.frame(width: 240)` inside their logic) instead of letting its parent control the size
      2. **Parent rigid sizing** — a parent composes a child with a hardcoded size (e.g., `SomeView().frame(width: 240)`) instead of using proportional layout

      1. **Find all `.frame()` calls with literal numeric width/height values** — hardcoded point values anywhere in view code
      2. **Every literal numeric frame is a violation** — regardless of where it appears:
         - A view hardcoding its own external size → should let its parent decide
         - A parent hardcoding a child's size → should use proportional sizing
         - A view hardcoding an internal element's size → remove frame, let element adapt to parent-given space or use proportional sizing
      3. **Count** fixed-frame violations

      ## SUI-10: Actor Isolation Granularity

      Inspect the reviewed view and the ViewModel types it uses whose
      declarations are present in the supplied source. The SwiftUI View
      exception applies to the view itself, not to its ViewModel.

      Marking a whole class or protocol `@MainActor` forces every property and method onto the main thread. For ViewModels this is especially dangerous — methods that perform network calls, parsing, or heavy computation cannot run on a background thread without explicit `nonisolated` or `Task.detached` workarounds. Protocols marked `@MainActor` can be problematic — they constrain **all** conformers to the main thread. However, protocol-level `@MainActor` is correct when all production conformers are legitimately `@MainActor` (facades, UI coordinators). In Swift 6 strict concurrency, removing `@MainActor` from a protocol while keeping it on the conformer causes "crosses into main actor-isolated code" errors.

      The correct pattern for **types** is per-member isolation: annotate only the properties and methods that must run on main (published state, UI callbacks), leaving the rest free to run on any executor.

      The correct pattern for **protocols** depends on conformer analysis: check whether any production conformer needs to run requirements off main thread.

      There are three distinct violations:

      1. **Type-level over-isolation** — `@MainActor` on a class/struct where not all members need main thread. The type should use per-member `@MainActor` annotations instead.
      2. **Protocol-level over-isolation** — `@MainActor` on a protocol where a **production conformer** needs to run some requirements off main thread. The protocol should annotate only the requirements that must be main-isolated. **Requires conformer analysis** — see detection step 4.
      3. **nonisolated escape hatch** — A type marked `@MainActor` that uses `nonisolated` on individual members to opt them out. This is a code smell indicating the type-level annotation is too broad — if members need to escape, the type shouldn't be globally isolated.

      1. **Find all `@MainActor` annotations on type declarations** — `@MainActor class`, `@MainActor struct`, `@MainActor protocol`, `@MainActor extension`
      2. **For each annotated class/struct, analyze members:**
         - List all methods and properties
         - Classify each as:
           - NEEDS_MAIN — members that **directly drive UI updates**: `@Published` or `@Observable`-tracked properties read by a View, methods whose sole purpose is mutating those properties, direct UIKit/AppKit main-thread API calls
           - BACKGROUND_SAFE — everything else: network/API calls, parsing, decoding, computation, filtering, sorting, file I/O, database access, caching. Methods that fetch-then-assign are BACKGROUND_SAFE — only the final state mutation needs main, not the whole method.
         - Count BACKGROUND_SAFE members
      3. **Check for `nonisolated` escape hatches** — any `nonisolated` keyword on members within a `@MainActor` type
      4. **Check protocols — conformer analysis required:**
         - For each `@MainActor protocol`, find all production conformers (exclude preview-only and test doubles)
         - If ALL production conformers are `@MainActor` (e.g., the protocol abstracts a facade or UI coordinator) → COMPLIANT. Protocol-level `@MainActor` correctly reflects conformer reality and avoids Swift 6 crossing errors.
         - If ANY production conformer has background-safe work (needs to run requirements off main) → SEVERE. The protocol forces that conformer onto main thread unnecessarily.
         - If the protocol has NO production conformers yet (only preview/test) → COMPLIANT. Default to protocol-level until a real conformer needs otherwise.
      5. **Score:**
         - All type members genuinely need main thread AND no `nonisolated` present AND protocol conformers are all `@MainActor` → COMPLIANT
         - Any BACKGROUND_SAFE member on a type OR any `nonisolated` escape hatch OR protocol forcing a conformer off main → SEVERE

      Return one observation for every violation or explicitly excepted candidate,
      using exactly one of these classifications:

      - `BAD_CONTAINER_ACCESSIBILITY`
      - `FIXED_FRAME`
      - `OVER_ISOLATED`

      Set `is_exception` to true only when the individual observation matches an
      authored exception. Supply nonempty reasoning and precise source evidence
      for every observation. Return no observation for a compliant category.
      For SUI-9, emit one `FIXED_FRAME` observation per offending `.frame(...)`
      call. When the same call supplies both a literal width and a literal
      height, combine both dimensions in that observation's evidence rather
      than emitting one observation per argument.

      Exceptions apply to only the relevant observation:
      - Preview providers are outside production checks.
      - A custom container that applies accessibilityElement internally already
        supplies the accessibility behavior; confirm its implementation.
      - Frame constraints, flexible fill, proportional sizing, GeometryReader
        sizing, and a size explicitly required by the user are not fixed-frame
        violations.
      - SwiftUI View structs, UIKit/AppKit representable types, and app entry
        points are exempt from type-level actor-isolation findings.
      Repository evidence: No MCP-owned repository evidence was supplied.
    outputs:
      - name: preview_limitations
        type: data
        schema:
          type: array
          items: {type: string, minLength: 1}
      - name: preview_facts
        type: data
        schema:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [is_preview, is_file_scope, has_preview, reasoning, evidence]
            properties:
              is_preview:
                type: boolean
                description: The reviewed view is preview-only code, not merely a production view with a preview.
              is_file_scope: {type: boolean}
              has_preview:
                type: boolean
                description: A preview instantiation is present in the supplied source or cross-file evidence.
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}
      - name: observations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - classification
              - location
              - is_exception
              - reasoning
              - evidence
            properties:
              classification:
                type: string
                enum:
                  - BAD_CONTAINER_ACCESSIBILITY
                  - FIXED_FRAME
                  - OVER_ISOLATED
              location: {type: string, minLength: 1}
              is_exception: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: classify_extrema_observations
    type: agent
    prompt: |
      Analyze view unit `{{params.review_unit.target.name}}` from the source
      already visible in this session. Return observations, not maxima, counts,
      severities, or findings.

      ## SUI-1 / SUI-2: Builder Nesting and View Expressions

      Even moderately nested view hierarchies should be decomposed into extracted subviews. Complexity doesn't disappear when moved from `body` into helper `var`s — each view-returning property is measured independently.

      1. **Identify all view-returning properties** — `body` plus any `var`/`func` that returns `some View`
      2. **For each view-returning property, identify:**
         - The deepest builder-only path (each View/container that takes a `@ViewBuilder` closure adds one level)
         - All view expression occurrences (`Text`, `Image`, `Button`, `HStack`, `VStack`, `List`, custom view calls, etc.)
      3. **Exclude modifiers** — `.padding()`, `.font()`, `.background()` do NOT add nesting or count as separate expressions
      Return one `view_properties` entry for every view-returning property.
      A leaf view adds no builder level: the deepest path in
      `VStack { HStack { Text(...) } }` is ["VStack", "HStack"].
      Include only expressions that produce a SwiftUI `View`. Action closures and
      other non-`@ViewBuilder` closures, including a `Task` created inside a
      `Button` action, add neither a view expression nor a nesting level. Count
      expression occurrences rather than unique view types, so two separate
      `Text` expressions count twice.

      Copy the deepest ordered path into `deepest_path` and every ordered
      occurrence into `expressions`. Preserve duplicate expression names as
      separate array entries. Use empty arrays only when the property genuinely
      contains no View expression. A leaf-only member has an empty deepest_path
      but still has an expression. Mark preview context and app-entry context
      separately; the app-entry exception concerns nesting only.
      is_preview means preview-only code, not a production view that has a preview.

      ## SUI-3: Modifier Chain Length

      When a view expression inside a `@ViewBuilder` closure (inside `body` or any view-returning property) has 2 or more chained modifiers, it should be extracted into a named `var` or separate subview. This keeps each closure body scannable at a glance.

      **Scope:** Only counts modifiers on **nested child views** inside a closure — NOT on the top-level return value of `body` or a computed property. The top-level view's own modifiers are part of its external API and don't hurt readability.

      1. **For each `@ViewBuilder` closure** in `body` and view-returning properties
      2. **For each child view expression** inside that closure (not the outermost container)
      3. **Identify chained modifiers** (`.font()`, `.padding()`, `.background()`, `.foregroundColor()`, `.frame()`, `.overlay()`, `.clipShape()`, etc.)

      Return one `modifier_chains` entry for every expression with at least one
      modifier, including the outermost expression. Mark whether it is a
      nested child and whether it is in preview context.
      Copy every modifier call into `modifiers` in source order; one
      `.frame(width:height:)` call is one modifier. Preserve equal chains as
      independent evidence and do not submit the chain length. Do not prefilter
      entries using the violation threshold: one-modifier chains are required
      evidence even though they are individually compliant. Omitting any
      modifier-bearing nested child makes the observation collection incomplete.
      A container nested inside another builder is still a child even when it
      opens its own builder closure. For example, in
      `VStack { HStack { ... }.accessibilityIdentifier(...) }`, include the
      `HStack` modifier chain as nested; the outermost `VStack` is not nested.

      Extraction into a named property, named subview, or modifier serves
      readability first. No demonstrated reuse is required.
      Record unresolved builder or modifier semantics in limitations rather
      than treating an incomplete inventory as empty. An empty limitations
      list means the structural inventory is complete.
    outputs:
      - name: limitations
        type: data
        schema:
          type: array
          items: {type: string, minLength: 1}
      - name: view_properties
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, deepest_path, expressions, is_preview, is_app_entry_point, reasoning, evidence]
            properties:
              location: {type: string, minLength: 1}
              deepest_path:
                type: array
                items: {type: string, minLength: 1}
              expressions:
                type: array
                items: {type: string, minLength: 1}
              is_preview: {type: boolean}
              is_app_entry_point: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}
      - name: modifier_chains
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, modifiers, is_preview, is_nested_child, reasoning, evidence]
            properties:
              location: {type: string, minLength: 1}
              modifiers:
                type: array
                minItems: 1
                items: {type: string, minLength: 1}
              is_preview: {type: boolean}
              is_nested_child: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}

  - id: classify_view_purity
    type: agent
    prompt: |
      A view's only job is to declare UI as a function of state. Data access,
      business transformations, separate formatting logic, validation, and
      calculations belong in a ViewModel or domain layer. This is a role
      constraint, not a count of responsibilities.

      Classify behavior in view unit `{{params.review_unit.target.name}}`
      from the source already visible in this session:
      - Every method and computed property, including `body` and view helpers.
      - Inline expressions, Button actions, .task closures, lifecycle callbacks,
        and other nested closures.

      Use the innermost owning member or closure as the location. An expression
      belongs to its containing scope. A closure implementing an operation such
      as filter or map belongs to that operation's scope; a separate action or
      lifecycle callback owns its behavior. Do not attribute a nested scope's
      behavior again to its parent. Multiple behaviors in one scope use the
      same location. Include every applicable behavior, not just the scope's
      primary purpose: view composition can coexist with business operations
      or formatting inside its argument expressions.
      For each scope, inspect both the UI constructors and the expressions
      building their arguments. Classify those operations separately even
      when they share one location. A VIEW_COMPOSITION record for a constructor
      does not classify the argument-building operations within it.

      Classifications:
      - VIEW_COMPOSITION: declares or returns UI, including mapping state to
        child views without business transformations.
      - APPEARANCE: configures view appearance.
      - PRESENTATION_STATE: toggles simple UI state such as showing a sheet.
      - ACTION_FORWARDING: simple action forwarding to the ViewModel with no
        additional business logic, including awaiting the forwarded action.
      - NATIVE_FORMAT: SwiftUI-native formatting such as Text(value, format:).
      - DATA_FETCH: network calls, database reads, or file I/O.
      - TRANSFORM: business sorting, filtering, mapping, or grouping.
      - FORMAT: string, date, or number formatting outside SwiftUI-native APIs.
      - VALIDATE: input validation or business-rule checking.
      - COMPUTE: calculations, state-machine transitions, or derived business state.

      A return type of some View does not exempt business logic inside a helper.
      Classify the operation, not merely the presence of map, a closure, or await.
      Building a display string using string, date, or number operations before
      passing it to a view is FORMAT, including inline expressions in body.
      NATIVE_FORMAT applies to SwiftUI's own formatting API, not to any value
      that eventually appears in Text.
      Task lifecycle and detachment are separate concurrency checks; awaiting
      a forwarded action alone does not make a view impure.

      Mark preview-only code per behavior; having a preview does not exempt
      production behavior. Record missing evidence that prevents
      classification in limitations; an empty list means the inventory is complete.
    outputs:
      - name: limitations
        type: data
        schema:
          type: array
          items: {type: string, minLength: 1}
      - name: behaviors
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [classification, location, is_preview, reasoning, evidence]
            properties:
              classification:
                type: string
                enum: [VIEW_COMPOSITION, APPEARANCE, PRESENTATION_STATE, ACTION_FORWARDING, NATIVE_FORMAT, DATA_FETCH, TRANSFORM, FORMAT, VALIDATE, COMPUTE]
              location: {type: string, minLength: 1}
              is_preview: {type: boolean}
              reasoning: {type: string, minLength: 1}
              evidence:
                type: string
                minLength: 1
                description: Cite the specific classified operation, including argument-building expressions, rather than abbreviating the whole body.

  - id: count_nesting_paths
    type: operation
    operation: collection.count
    depends_on: [classify_extrema_observations]
    for_each: "{{steps.classify_extrema_observations.outputs.view_properties}}"
    when:
      all:
        - ref: "{{item.is_preview}}"
          equals: false
        - ref: "{{item.is_app_entry_point}}"
          equals: false
    with:
      values: "{{item.deepest_path}}"

  - id: count_view_expressions
    type: operation
    operation: collection.count
    depends_on: [classify_extrema_observations]
    for_each: "{{steps.classify_extrema_observations.outputs.view_properties}}"
    when:
      ref: "{{item.is_preview}}"
      equals: false
    with:
      values: "{{item.expressions}}"

  - id: count_modifier_chains
    type: operation
    operation: collection.count
    depends_on: [classify_extrema_observations]
    for_each: "{{steps.classify_extrema_observations.outputs.modifier_chains}}"
    when:
      all:
        - ref: "{{item.is_preview}}"
          equals: false
        - ref: "{{item.is_nested_child}}"
          equals: true
    with:
      values: "{{item.modifiers}}"

  - id: body_nesting_depth
    type: metric
    metric_id: SUI-1
    depends_on: [count_nesting_paths]
    when:
      ref: "{{steps.classify_extrema_observations.outputs.limitations}}"
      equals: []
    unavailable_reason: The view structure could not be completely classified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.count_nesting_paths.outputs.value}}"
      reducer:
        type: maximum
        value: "{{item}}"
        empty_value: 0
      severe: {operator: greater_than_or_equal, value: 2}

  - id: view_expression_count
    type: metric
    metric_id: SUI-2
    depends_on: [count_view_expressions]
    when:
      ref: "{{steps.classify_extrema_observations.outputs.limitations}}"
      equals: []
    unavailable_reason: The view structure could not be completely classified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.count_view_expressions.outputs.value}}"
      reducer:
        type: maximum
        value: "{{item}}"
        empty_value: 0
      severe: {operator: greater_than_or_equal, value: 5}

  - id: max_modifier_chain
    type: metric
    metric_id: SUI-3
    depends_on: [count_modifier_chains]
    when:
      ref: "{{steps.classify_extrema_observations.outputs.limitations}}"
      equals: []
    unavailable_reason: The view structure could not be completely classified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.count_modifier_chains.outputs.value}}"
      reducer:
        type: maximum
        value: "{{item}}"
        empty_value: 0
      severe: {operator: greater_than_or_equal, value: 2}

  - id: impure_count
    type: metric
    metric_id: SUI-4
    depends_on: [classify_view_purity]
    when:
      ref: "{{steps.classify_view_purity.outputs.limitations}}"
      equals: []
    unavailable_reason: View behavior could not be completely classified.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_view_purity.outputs.behaviors}}"
      when:
        all:
          - ref: "{{item.classification}}"
            in: [DATA_FETCH, TRANSFORM, FORMAT, VALIDATE, COMPUTE]
          - ref: "{{item.is_preview}}"
            equals: false
      reducer:
        type: distinct_count
        value: "{{item.location}}"
      severe: {operator: greater_than_or_equal, value: 1}

  - id: vm_injection_style
    type: metric
    metric_id: SUI-5
    prompt: |
      When a view delegates logic or data access to a ViewModel, that dependency must be injected via protocol interfaces — a State protocol (what the view reads) and an Actions protocol (what the view triggers). A view referencing a concrete ViewModel class is sealed to that implementation.

      1. **Identify the ViewModel property** — the stored property that serves as
         the view's logic/data source (typically @Observable class, ObservableObject,
         or any type providing business state + actions)
      2. **Check injection style:**
          - Concrete class type → VIOLATION
          - Protocol that extends `Observable` → must use generic constraint
            (SwiftUI's observation tracking needs the concrete type at compile time).
            Generic constrained to protocol(s) → COMPLIANT.
            Plain protocol property → VIOLATION (observation won't work)
          - Protocol that does NOT extend `Observable` → plain protocol-typed
            property is COMPLIANT. No generic needed.
      3. **Not in scope:** plain value properties (String, Bool, structs),
         closures/actions, nested child views, style/configuration types

      Return `protocol`, `concrete`, or `none` with reasoning and precise evidence.

      Apply this measurement to view unit `{{params.review_unit.target.name}}` from the source already visible in this session.
    value: {type: string}
    scoring:
      severe: {operator: equals, value: concrete}

  - id: preview_only_count
    type: metric
    metric_id: SUI-6
    depends_on: [classify_countable_observations]
    when:
      ref: "{{steps.classify_countable_observations.outputs.preview_limitations}}"
      equals: []
    unavailable_reason: Preview facts could not be established from the supplied review context.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_countable_observations.outputs.preview_facts}}"
      when:
        all:
          - ref: "{{item.is_preview}}"
            equals: true
          - ref: "{{item.is_file_scope}}"
            equals: true
      severe: {operator: greater_than_or_equal, value: 1}

  - id: views_without_preview_count
    type: metric
    metric_id: SUI-7
    depends_on: [classify_countable_observations]
    when:
      ref: "{{steps.classify_countable_observations.outputs.preview_limitations}}"
      equals: []
    unavailable_reason: Preview facts could not be established from the supplied review context.
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_countable_observations.outputs.preview_facts}}"
      when:
        all:
          - ref: "{{item.is_preview}}"
            equals: false
          - ref: "{{item.is_file_scope}}"
            equals: true
          - ref: "{{item.has_preview}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: bad_accessibility_count
    type: metric
    metric_id: SUI-8
    depends_on: [classify_countable_observations]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_countable_observations.outputs.observations}}"
      when:
        all:
          - ref: "{{item.classification}}"
            equals: BAD_CONTAINER_ACCESSIBILITY
          - ref: "{{item.is_exception}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: fixed_frame_count
    type: metric
    metric_id: SUI-9
    depends_on: [classify_countable_observations]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_countable_observations.outputs.observations}}"
      when:
        all:
          - ref: "{{item.classification}}"
            equals: FIXED_FRAME
          - ref: "{{item.is_exception}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: over_isolated_count
    type: metric
    metric_id: SUI-10
    depends_on: [classify_countable_observations]
    value: {type: integer, minimum: 0}
    scoring:
      source: "{{steps.classify_countable_observations.outputs.observations}}"
      when:
        all:
          - ref: "{{item.classification}}"
            equals: OVER_ISOLATED
          - ref: "{{item.is_exception}}"
            equals: false
      severe: {operator: greater_than_or_equal, value: 1}

  - id: classify_exception
    type: exception
    prompt: |
      Classify the whole-unit exception for view unit
      `{{params.review_unit.target.name}}` using the source already visible
      in this session.

      A unit defined entirely inside #Preview or a PreviewProvider is preview
      infrastructure and is exempt. Otherwise there is no rule-wide exception.
      A production view with a preview is not exempt. A preview-only view
      declared at file scope is not exempt from its containment check.
      App-entry nesting, root modifier chains, action forwarding, native
      formatting, accessibility wrappers, sizing, and actor-isolation exceptions
      affect only the relevant observation, not every metric for the view.
