id: lsp-single-prompt
name: LSP Single Prompt Experiment
description: Collects every LSP analysis, metric observation, and exception decision in one model-facing step.
max_turns: 3

steps:
  - id: assess_lsp
    prompt: |
      Review every supplied unit from the source already visible in this session. For each listed unit, complete the shared substitutability analysis, all four LSP measurements, and the exception decision before responding. Return every field required by the output schema.

      Shared analysis:
      1. Inventory `is`, `as?`, `as!`, and `type(of:)` checks. Classify ownership as DEVELOPER when the checked type is project-owned, EXTERNAL when it is not found in the project or local packages, and UNKNOWN when ownership cannot be verified.
      2. Concrete class inheritance with at least one override triggers contract analysis. Protocol conformance is not concrete inheritance. For each override whose base source is available, count new guards, weakened postconditions, and invariant violations. When base source is unavailable, record that it cannot be verified.
      3. Inventory only contract implementations whose bodies occur inside this unit. Classify each as MEANINGFUL, EMPTY, or FATAL. Protocol requirements without bodies are not implementations.

      LSP-1: count type checks classified DEVELOPER. EXTERNAL checks are exceptions; do not treat UNKNOWN as violations.
      LSP-2: when concrete inheritance with overrides is triggered, sum new guards, weakened postconditions, and invariant violations. Otherwise return zero.
      LSP-3: count contract implementations classified FATAL, including bodies whose complete behavior is `fatalError`, `preconditionFailure`, or another crash assertion.
      LSP-4: count contract implementations classified EMPTY. Do not include FATAL implementations.

      Whole-unit exception: a deliberately named NoOp object is exempt when 100% of its contract methods and values are empty or return documented defaults.
    outputs:
      - name: type_check_analysis
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [expression, ownership, evidence]
            properties:
              expression: {type: string, minLength: 1}
              ownership: {type: string, enum: [DEVELOPER, EXTERNAL, UNKNOWN]}
              evidence: {type: string, minLength: 1}
      - name: inheritance_analysis
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [has_trigger, relationships, reasoning, evidence]
          properties:
            has_trigger: {type: boolean}
            relationships:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [base_type, source_available, evidence, overrides]
                properties:
                  base_type: {type: string, minLength: 1}
                  source_available: {type: boolean}
                  evidence: {type: string, minLength: 1}
                  overrides:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [member, new_guards, weakened_postconditions, invariant_violations, evidence]
                      properties:
                        member: {type: string, minLength: 1}
                        new_guards: {type: integer, minimum: 0}
                        weakened_postconditions: {type: integer, minimum: 0}
                        invariant_violations: {type: integer, minimum: 0}
                        evidence: {type: string, minLength: 1}
            reasoning: {type: string, minLength: 1}
            evidence: {type: string, minLength: 1}
      - name: contract_implementations
        type: data
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [member, classification, evidence]
            properties:
              member: {type: string, minLength: 1}
              classification: {type: string, enum: [MEANINGFUL, EMPTY, FATAL]}
              evidence: {type: string, minLength: 1}
      - name: type_checks
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [value, additional_info]
          properties:
            value: {type: integer, minimum: 0}
            additional_info: &audit
              type: object
              additionalProperties: false
              required: [reasoning, evidence]
              properties:
                reasoning: {type: string, minLength: 1}
                evidence: {type: string, minLength: 1}
      - name: contract_violations
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [value, additional_info]
          properties:
            value: {type: integer, minimum: 0}
            additional_info: *audit
      - name: fatal_error_methods
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [value, additional_info]
          properties:
            value: {type: integer, minimum: 0}
            additional_info: *audit
      - name: empty_methods
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [value, additional_info]
          properties:
            value: {type: integer, minimum: 0}
            additional_info: *audit
      - name: exception
        type: data
        schema:
          type: object
          additionalProperties: false
          required: [is_exception, additional_info]
          properties:
            is_exception: {type: boolean}
            additional_info: *audit
